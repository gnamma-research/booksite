<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Three-Book Reader · Gnamma Research</title><link rel="stylesheet" href="assets/hikma-reader.css"><style>body{margin:0}.three-reader{display:flex;flex-direction:column;height:100dvh}.three-header{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;border-bottom:1px solid var(--line);gap:12px;flex-wrap:wrap;background:var(--paper)}.three-tabs{display:flex;gap:8px;flex-wrap:wrap}.three-tabs button{border:1px solid var(--line);background:var(--paper-raised);border-radius:3px;padding:9px 13px;font:13px Arial,sans-serif}.three-tabs button[aria-pressed=true]{background:var(--accent);color:var(--paper-raised)}iframe{border:0;flex:1;width:100%;min-height:0;background:var(--paper)}.quiet{font:11px Arial,sans-serif;color:var(--muted)}@media(max-width:650px){.three-header{padding:8px}.three-tabs button{padding:8px 9px;font-size:11px}.quiet{font-size:9px}}</style></head><body><div class="three-reader"><header class="three-header"><div class="three-tabs" role="group" aria-label="Select philosophy book"><button data-book="0" aria-pressed="true">I · al-Manṭiq</button><button data-book="1" aria-pressed="false">II · Bidāya</button><button data-book="2" aria-pressed="false">III · Nihāya</button></div><a href="./" class="quiet">Study collection ↗</a></header><iframe id="bookframe" title="Gnamma bilingual philosophy reader" src="muzaffar-al-mantiq/" loading="eager"></iframe></div><script>const src=["muzaffar-al-mantiq/","bidayat-al-hikma/","nihayat-al-hikma/"];function activate(n){if(!(n>=0&&n<3))return;document.querySelectorAll("[data-book]").forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.book===n)));const f=document.getElementById("bookframe");if(!f.getAttribute("src").startsWith(src[n]))f.src=src[n];history.replaceState(null,"","#"+["logic","bidaya","nihaya"][n]);}document.querySelectorAll("[data-book]").forEach(b=>b.onclick=()=>activate(+b.dataset.book));const h=location.hash.slice(1);if(h==="bidaya")activate(1);else if(h==="nihaya")activate(2);else activate(0);</script></body></html>
