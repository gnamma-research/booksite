<aside class="gn-work-contents gn-glass" id="st-contents" aria-label="Contents"><h2>Contents</h2><div id="st-toc"></div></aside>
<article class="gn-work-reader gn-glass" id="st-reader" tabindex="-1">
 <div class="gn-work-controls">
  <button type="button" id="st-contents-btn" aria-label="Contents" title="Contents">☷</button>
  <span id="st-workkind"></span>
  <div class="gn-work-actions">
   <button type="button" id="st-small" title="Compact reading" aria-label="Compact reading">◫</button>
   <button type="button" id="st-full" title="Focus reading" aria-label="Focus reading">⛶</button>

  </div>
 </div>
 <div class="gn-study-progress" aria-label="Reading progress"><span id="st-progress"></span></div>
 <div class="gn-work-scroll" id="st-scroll">

  <h1 id="st-title"></h1><p class="gn-work-status" id="st-status"></p>
