name: Daruri Arabic Precise PDF Visual and Performance QA
on:
  workflow_dispatch:
  push:
    branches: [feature/daruri-arabic-pango-pilot-20261022]
    paths:
      - '.github/workflows/daruri-arabic-visual-perf.yml'
      - 'daruri/qa/verify-arabic-personal-visual.py'
      - 'daruri/qa/verify-arabic-personal-export-browser.mjs'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install PDF and browser validators
        run: |
          python -m pip install PyMuPDF==1.26.7
          npm install --no-save --prefix daruri/qa playwright@1.56.1 pdf-lib@1.17.1
          npx --prefix daruri/qa playwright install --with-deps chromium
      - name: Serve current Daruri reader
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/daruri-visual-http.log 2>&1 &
          for i in $(seq 1 50); do
            curl -sf http://127.0.0.1:8123/daruri/ >/dev/null && exit 0
            sleep .25
          done
          exit 1
      - name: Generate Arabic PDF, record file size and browser duration
        env:
          GNAMMA_ARABIC_PHONE_FIXTURE: '1'
        run: node daruri/qa/verify-arabic-personal-export-browser.mjs
      - name: Check exact source highlight pixels and zero unrelated PDF changes
        run: python daruri/qa/verify-arabic-personal-visual.py
      - name: Upload Arabic PDF visual proofs and performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daruri-arabic-precise-visual-and-performance
          path: |
            daruri/qa/arabic-visual-output/
            daruri/qa/phone-output/arabic-performance.json
          if-no-files-found: warn
          retention-days: 30
