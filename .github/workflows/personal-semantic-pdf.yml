name: Daruri personal PDF precision, search and mobile QA
on:
  push:
    branches: [master, feature/personal-pdf-search-precise-highlights-20261021]
    paths:
      - 'daruri/personal-export*'
      - 'daruri/personal-pdf-enhancements.js'
      - 'daruri/personal-anchor-maps/**'
      - 'daruri/vendor/**'
      - 'daruri/reading-desk.js'
      - 'daruri/sw.js'
      - 'daruri/download-bundle.js'
      - 'daruri/pdf-editions-manifest.json'
      - 'daruri/qa/verify-personal-pdf-upgrade.cjs'
      - 'daruri/qa/verify-semantic-personal-pdf.cjs'
      - '.github/workflows/personal-semantic-pdf.yml'
  pull_request:
    paths:
      - 'daruri/personal-export*'
      - 'daruri/personal-pdf-enhancements.js'
      - 'daruri/personal-anchor-maps/**'
      - 'daruri/vendor/**'
      - 'daruri/sw.js'
      - 'daruri/download-bundle.js'
      - 'daruri/reading-desk.js'
      - 'daruri/qa/verify-personal-pdf-upgrade.cjs'
      - 'daruri/qa/verify-semantic-personal-pdf.cjs'
      - '.github/workflows/personal-semantic-pdf.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  semantic-and-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate script syntax, privacy, lossless notes and verified geometry
        run: |
          node --check daruri/personal-export.js
          node --check daruri/personal-pdf-enhancements.js
          node daruri/qa/verify-personal-pdf-upgrade.cjs
          node daruri/qa/verify-personal-export.js
          node daruri/qa/verify-personal-export-safety.js
          node daruri/qa/verify-reading-desk-redesign.js
      - name: Install version-pinned PDF readers and web engines
        run: |
          npm install --no-save --prefix daruri/qa playwright@1.56.1 pdf-lib@1.17.1 pdfjs-dist@5.4.296
          npx --prefix daruri/qa playwright install --with-deps chromium webkit
      - name: Generate PDFs in Chromium, Android-style Chromium and WebKit
        run: node daruri/qa/verify-semantic-personal-pdf.cjs
      - name: Recheck existing PDF and iOS-size print navigation
        run: |
          node daruri/qa/personal-export-browser.cjs
          node daruri/qa/personal-export-webkit.cjs