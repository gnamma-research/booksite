name: Daruri applications matrix
on:
  push:
    branches: [daruri-applications-matrix-20261110]
    paths:
      - '.github/workflows/daruri-applications-matrix.yml'
      - 'daruri/applications-matrix*'
      - 'daruri/qa/applications-matrix*'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect canonical records without changing source
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const nodes={};const sandbox={window:{},console,document:{getElementById:id=>nodes[id]||(nodes[id]={textContent:''})}};
          try{vm.runInNewContext(fs.readFileSync('daruri/edition-r3-20261020.js','utf8'),sandbox)}catch(e){console.error(e.message);process.exit(1)}
          const book=JSON.parse(nodes.editionData.textContent);
          const html=fs.readFileSync('daruri/index.html','utf8');
          const report={keys:Object.keys(book),apps:book.apps.map(({text,...a})=>a),sections:book.sections.map(s=>({id:s.id,title:s.title,headingEn:s.headingEn,part:s.part}))};
          fs.writeFileSync('daruri/qa/applications-matrix-inspection.json',JSON.stringify(report,null,2)+'\n');
          let integration='';
          for(const term of ['function renderApplications','function appCard','function gnLinkAppRefs','function gnAppJump','function gnApp','function showAppDetail']){
            const i=html.indexOf(term);integration+='\n### '+term+' ('+i+')\n'+html.slice(Math.max(0,i-100),i+5000)+'\n';
          }
          integration+='\n### Bundle\n'+fs.readFileSync('daruri/download-bundle.js','utf8');
          fs.writeFileSync('daruri/qa/applications-matrix-integration.txt',integration);
          console.log('Captured',book.apps.length,'applications and',book.sections.length,'section titles.');
          NODE
      - name: Save branch-only inspection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add daruri/qa/applications-matrix-inspection.json daruri/qa/applications-matrix-integration.txt
          git diff --cached --quiet || git commit -m 'Capture Daruri application records and integration points'
          git push origin HEAD:daruri-applications-matrix-20261110
