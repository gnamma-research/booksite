name: Daruri 137 personal editions PDF matrix (isolated)
on:
  push:
    branches: ['experiment/production-pdf-parity-20261022']
    paths:
      - 'pdf_parity_ci/all_personal_exports.cjs'
      - 'pdf_parity_ci/audit_personal_pdf.py'
      - '.github/workflows/daruri-pdf-personal-matrix.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-export-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    env:
      SHARD: ${{ matrix.shard }}
      SHARDS: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install local-only PDF dependencies
        run: |
          python -m pip install -q "PyMuPDF==1.26.7"
          npm install --no-save --no-package-lock --prefix daruri/qa playwright@1.56.1 pdf-lib@1.17.1 pdfjs-dist@5.4.394
          npx --prefix daruri/qa playwright install --with-deps chromium
      - name: Verify personalized PDF export across assigned catalogue shard
        run: node pdf_parity_ci/all_personal_exports.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gnamma-personal-matrix-shard-${{ matrix.shard }}
          path: pdf_parity_ci/matrix_reports/shard-${{ matrix.shard }}.json
          retention-days: 14
