name: Daruri EXPERIMENT PDF.js original Arabic search
on:
  workflow_dispatch:
  pull_request:
    branches:
      - feature/daruri-arabic-pango-pilot-20261022
    paths:
      - daruri/qa/experimental_original_arabic_unicode.py
      - daruri/qa/experimental_original_pdfjs.cjs
      - .github/workflows/daruri-experimental-source-pdfjs.yml
permissions:
  contents: read
jobs:
  original-arabic-pdfjs:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install independent PDF engines
        run: |
          python -m pip install "PyMuPDF==1.26.7" "fonttools>=4.55,<5"
          sudo apt-get update -qq && sudo apt-get install -y poppler-utils
          npm install --prefix /tmp/gnpdfjs --no-save --no-package-lock pdfjs-dist@5.4.394
      - name: Build isolated 414-segment source PDF proof
        run: |
          python daruri/qa/experimental_original_arabic_unicode.py \
            --input daruri/editions/reading/daruri-reading-arabic-titles-off.pdf \
            --map daruri/editions/maps/daruri-reading-arabic-titles-off.pdf.json \
            --font daruri/build/fonts/NotoNaskhArabic-Regular.ttf \
            --output /tmp/daruri-source-pdfjs-PROTOTYPE.pdf \
            --limit 414 --diagnostic
      - name: PDF.js source Arabic phrase coverage
        run: |
          node daruri/qa/experimental_original_pdfjs.cjs \
            /tmp/daruri-source-pdfjs-PROTOTYPE.pdf \
            daruri/editions/maps/daruri-reading-arabic-titles-off.pdf.json \
            /tmp/gnpdfjs
