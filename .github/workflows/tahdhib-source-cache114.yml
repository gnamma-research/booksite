name: Tahdhib remaining-source cache114
on:
  workflow_dispatch:
  push:
    branches: ['tahdhib-english-first-pass-stage114-20261111']
    paths: ['.github/workflows/tahdhib-source-cache114.yml']
permissions:
  contents: read
jobs:
  cache-public-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - name: Cache the public source without claiming translation or collation
        run: |
          python - <<'PY'
          import concurrent.futures, datetime, hashlib, json, pathlib, time
          import requests
          from bs4 import BeautifulSoup
          root=pathlib.Path('tahdhib-arabic-cache114');root.mkdir()
          def get(page):
              url=f'https://ablibrary.net/book_content/b/12170/{page}?lang=ar'
              rec={'page':page,'sourceUrl':url,'retrieved':datetime.datetime.now(datetime.timezone.utc).isoformat(),'translationStatus':'not_assessed','scanCertified':False}
              try:
                  r=requests.get(url,timeout=(7,18),headers={'User-Agent':'GNAMMA source-preservation research; single-book public text retrieval'})
                  rec['httpStatus']=r.status_code
                  r.raise_for_status()
                  r.encoding=r.apparent_encoding or 'utf-8'
                  html=r.text
                  soup=BeautifulSoup(html,'html.parser')
                  for tag in soup(['script','style','nav']):tag.decompose()
                  text=soup.get_text('\n',strip=True)
                  rec['htmlSha256']=hashlib.sha256(html.encode()).hexdigest()
                  rec['textCharacters']=len(text)
                  rec['title']=soup.title.get_text() if soup.title else ''
                  rec['status']='retrieved' if len(text)>150 else 'short_response'
                  (root/f'q{page:03}.html').write_text(html,encoding='utf-8')
                  (root/f'q{page:03}.txt').write_text(text,encoding='utf-8')
              except Exception as e:
                  rec['status']='failed';rec['error']=str(e)
              return rec
          # Prove access before requesting a whole volume; do not silently forge source.
          probes=[get(p) for p in [225,226,253]]
          print(json.dumps(probes,ensure_ascii=False),flush=True)
          records=probes
          if any(x['status']=='retrieved' for x in probes):
              pending=[p for p in list(range(225,401))+list(range(127,225)) if p not in [225,226,253]]
              with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
                  for rec in pool.map(get,pending):
                      records.append(rec)
                      print(rec['page'],rec['status'],rec.get('textCharacters',0),flush=True)
          manifest={'book':12170,'source':'Qum searchable digital print; not a photographic witness','records':sorted(records,key=lambda x:x['page'])}
          (root/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          print('Retrieved',sum(x['status']=='retrieved' for x in records),'of',len(records),'attempted pages')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tahdhib-arabic-source-cache114
          path: tahdhib-arabic-cache114/
          retention-days: 30
          if-no-files-found: error
