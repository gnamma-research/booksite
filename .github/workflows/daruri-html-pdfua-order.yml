name: Daruri HTML-origin PDF-UA tag/reading-order experiment (NOT RELEASE)
on:
  push:
    branches: [research/daruri-html-first-pdf-20261022]
    paths:
      - 'daruri/dynamic-pdf/html_pdfua_reading_order.py'
      - '.github/workflows/daruri-html-pdfua-order.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daruri-html-pdfua-reading-order-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tagged-html:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        index: [0, 8, 10]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned source HTML renderer, Arabic fonts and PDF inspectors
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcairo2 libpango-1.0-0 libharfbuzz0b libfribidi0 poppler-utils
          python -m pip install -q -r daruri/build/requirements.txt 'PyMuPDF==1.26.7' 'pypdf==5.9.0' 'numpy>=1.26' 'scipy>=1.13'
      - name: Render source HTML both ordinarily and as tagged PDF-UA
        run: |
          python daruri/dynamic-pdf/html_pdfua_reading_order.py \
            --index ${{ matrix.index }} \
            --out /tmp/daruri-html-pdfua-${{ matrix.index }}
      - name: Record tag structure and unchanged source pages
        run: |
          python - <<'PY'
          import glob,json
          q=json.load(open(glob.glob('/tmp/daruri-html-pdfua-*/pdfua-comparison.json')[0]))
          a=q['tagged']
          print('PDFUA_SOURCE_ORDER_COMPARISON',json.dumps({
            'pages':a['pages'],
            'tag_root':a['catalogue']['StructTreeRoot'],
            'source_destinations':a['sections'],
            'page_count_preserved':q['same_page_count'],
            'unchanged_pixels':q['pages_pixel_equal'],
            'unchanged_extraction':q['pages_text_equal']
          }))
          assert a['sections']==258
          assert q['same_page_count']
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daruri-html-pdfua-${{ matrix.index }}-research
          path: |
            /tmp/daruri-html-pdfua-${{ matrix.index }}/pdfua-comparison.json
            /tmp/daruri-html-pdfua-${{ matrix.index }}/pdfua-original-NONRELEASE.pdf
          retention-days: 9
          if-no-files-found: warn
