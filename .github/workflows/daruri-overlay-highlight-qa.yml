name: Daruri overlay selection QA
on:
  workflow_dispatch:
  push:
    branches: [qa/daruri-overlay-highlight-acceptance-20261022]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: qa
      - uses: actions/checkout@v4
        with:
          ref: c2d9ba352fb7849cbb28ff2dd529f08b42c4ed47
          path: proof-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install PyMuPDF==1.26.7 fonttools==4.67.0
      - run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Generate temporary experimental Unicode proof
        run: |
          python proof-source/daruri/qa/experimental_original_arabic_unicode.py \
            --input proof-source/daruri/editions/reading/daruri-reading-arabic-titles-off.pdf \
            --map proof-source/daruri/editions/maps/daruri-reading-arabic-titles-off.pdf.json \
            --font proof-source/daruri/build/fonts/NotoNaskhArabic-Regular.ttf \
            --output /tmp/gnamma-overlay-proof.pdf --limit 414 --diagnostic
      - name: Check highlights and copy selection
        run: |
          python qa/daruri/qa/audit_unicode_overlay_selection.py \
            --source proof-source/daruri/editions/reading/daruri-reading-arabic-titles-off.pdf \
            --candidate /tmp/gnamma-overlay-proof.pdf \
            --map proof-source/daruri/editions/maps/daruri-reading-arabic-titles-off.pdf.json \
            --output /tmp/gnamma-overlay-selection.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unicode-overlay-selection-report
          path: /tmp/gnamma-overlay-selection.json
          if-no-files-found: warn
