name: GNAMMA dated sources and actionable undated records

on:
  pull_request:
    branches: [master]
    paths:
      - 'research/intellectual-atlas/**'
      - '.github/workflows/atlas-undated-workbench.yml'
  push:
    branches: [master]
    paths:
      - 'research/intellectual-atlas/**'
      - '.github/workflows/atlas-undated-workbench.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate bibliography author dates, unchanged source and publication manifest
        run: |
          python research/intellectual-atlas/corpora/verify.py
          python research/intellectual-atlas/corpora/verify_expansion.py
          python research/intellectual-atlas/build.py
          git diff --exit-code -- research/intellectual-atlas/index.html research/intellectual-atlas/publication.json
      - name: Check script syntax
        run: |
          node --check research/intellectual-atlas/atlas-unified.js
          node --check research/intellectual-atlas/atlas-geo.js
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    strategy:
      fail-fast: false
      matrix:
        include:
          - {browser: chromium, width: 1440, height: 900}
          - {browser: chromium, width: 390, height: 844}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real browser
        run: |
          python -m pip install -q playwright==1.58.0
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Serve static atlas
        run: |
          python -m http.server 8123 --bind 127.0.0.1 >/tmp/gnamma-undated-server.log 2>&1 &
          for i in {1..60}; do curl -fsS http://127.0.0.1:8123/research/intellectual-atlas/ >/dev/null && break; sleep .25; done
      - name: Test dated and undated works across all subject maps
        run: |
          python research/intellectual-atlas/tests/verify_unplaced_workbench_browser.py --browser ${{ matrix.browser }} --width ${{ matrix.width }} --height ${{ matrix.height }}
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: undated-source-workbench-${{ matrix.browser }}-${{ matrix.width }}
          path: /tmp/gnamma-undated-qa
          if-no-files-found: ignore
