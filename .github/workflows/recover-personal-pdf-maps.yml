name: Recover five current geometry maps from verified edition builds
on:
  push:
    branches: [feature/personal-pdf-search-precise-highlights-20261021]
    paths: ['.github/workflows/recover-personal-pdf-maps.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          run-id: 39561238587
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: word-map-*
          path: /tmp/gnamma-current-maps
          merge-multiple: false
      - name: Copy only the map generated by each individual edition job
        run: |
          cp /tmp/gnamma-current-maps/word-map-scholarly/daruri.pdf.json daruri/personal-anchor-maps/daruri.pdf.json
          cp /tmp/gnamma-current-maps/word-map-study/daruri-study.pdf.json daruri/personal-anchor-maps/daruri-study.pdf.json
          cp /tmp/gnamma-current-maps/word-map-english/daruri-english.pdf.json daruri/personal-anchor-maps/daruri-english.pdf.json
          cp /tmp/gnamma-current-maps/word-map-arabic/daruri-arabic.pdf.json daruri/personal-anchor-maps/daruri-arabic.pdf.json
          cp /tmp/gnamma-current-maps/word-map-arabic-vowelled/daruri-arabic-vowelled.pdf.json daruri/personal-anchor-maps/daruri-arabic-vowelled.pdf.json
      - name: Verify all PDFs and map coverage before committing
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          p=Path('daruri')
          manifest=json.loads((p/'pdf-editions-manifest.json').read_text())
          for filename in ['daruri.pdf','daruri-study.pdf','daruri-english.pdf','daruri-arabic.pdf','daruri-arabic-vowelled.pdf']:
              m=json.loads((p/'personal-anchor-maps'/(filename+'.json')).read_text())
              digest=hashlib.sha256((p/filename).read_bytes()).hexdigest()
              assert digest==m['source_sha256']==manifest['files'][filename]['sha256'],filename
              assert m['coverage']>0.99,filename
              assert len(m['segments'])>400,filename
              print('PASS',filename,'sha',digest[:12],'coverage',m['coverage'])
          PY
      - name: Safely rebase and publish verified updated maps
        run: |
          git config user.name "gnamma-research-ci"
          git config user.email "gnamma-research-ci@users.noreply.github.com"
          git add daruri/personal-anchor-maps
          git commit -m "Bind precise highlights to refreshed five canonical PDF editions"
          for attempt in 1 2 3 4 5; do
            git fetch origin feature/personal-pdf-search-precise-highlights-20261021
            git rebase FETCH_HEAD
            if git push origin HEAD:feature/personal-pdf-search-precise-highlights-20261021; then exit 0; fi
            sleep 2
          done
          exit 1