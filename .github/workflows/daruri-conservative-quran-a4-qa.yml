name: Daruri conservative Quran A4 edition QA

on:
  push:
    branches: [fix/daruri-quran-allusion-audit-20261021]
    paths:
      - '.github/workflows/daruri-conservative-quran-a4-qa.yml'
      - 'daruri/build/data/quran-source-notes.json'
      - 'daruri/edition-r3-20261020.js'
      - 'daruri/build/main_text.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daruri-conservative-quran-a4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install A4 edition dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2 libpango-1.0-0 libharfbuzz0b libfribidi0
          python -m pip install -r daruri/build/requirements.txt 'pypdf==5.9.0' 'PyMuPDF==1.26.7'
      - name: Build all ten A4 editions without publishing
        run: python daruri/build/publish_editions.py --output-dir /tmp/gnamma-quran-a4
      - name: Verify approved quotations and absence of weak source notes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import fitz
          root=Path('/tmp/gnamma-quran-a4')
          manifest=json.loads((root/'manifest.json').read_text())
          q=json.loads(Path('daruri/build/data/quran-source-notes.json').read_text())
          assert len(q['notes'])==48 and len(q['withheld_editorial_allusions'])==5
          assert len(manifest['files'])==10
          assert sum(f['tier']=='reading' for f in manifest['files'])==8
          assert sum(f['tier']=='study' for f in manifest['files'])==2
          for record in manifest['files']:
              with fitz.open(root/record['file']) as pdf:
                  assert len(pdf)==record['pages']
                  assert len(pdf.get_toc())==record['bookmarks']
                  assert all(n not in page.get_text() for page in pdf
                             for n in ('Cf. Qurʾān, al-Raḥmān 55:4', 'Cf. Qurʾān, Yūsuf 12:53'))
              print(record['file'], record['pages'], record['links'])
          print('PASS: 10 A4 reading/study editions preserve source distinctions')
          PY
      - name: Upload A4 preview and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daruri-conservative-quran-a4-preview
          path: |
            /tmp/gnamma-quran-a4/manifest.json
            /tmp/gnamma-quran-a4/reading/*.pdf
            /tmp/gnamma-quran-a4/study/*.pdf
          if-no-files-found: warn
