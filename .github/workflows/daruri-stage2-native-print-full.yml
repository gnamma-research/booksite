name: Daruri genuine native HTML CSS 625-note Scholarly browser PDF without paginator (NONRELEASE)
on:
  push:
    branches: [research/daruri-native-html-scholarly-print-20261024]
    paths:
      - 'daruri/qa/stage2_shootout/ultimate_native_print_browser.cjs'
      - '.github/workflows/daruri-stage2-native-print-full.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daruri-native-html-book-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-html-book:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        edition: [scholarly, english, arabic-vowelled]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare complete ORIGINAL canonical Gnamma HTML (no PDF input)
        run: |
          python -m pip install -q beautifulsoup4 PyMuPDF==1.26.7
          python daruri/qa/stage2_shootout/ultimate_html_fixture.py \
            daruri/qa/stage2_shootout/runtime_ultimate ${{ matrix.edition }}
      - name: Install ONLY Playwright browser QA runner (no typesetting runtime)
        run: |
          npm install --prefix daruri/qa/stage2_shootout --no-package-lock --no-audit --no-fund
          cd daruri/qa/stage2_shootout
          if [ '${{ matrix.browser }}' = chromium ]; then
            npx playwright install --with-deps --only-shell chromium
          else
            npx playwright install --with-deps webkit
          fi
      - name: Render actual complete HTML with native browser CSS Print engine
        env:
          NATIVE_EDITION: ${{ matrix.edition }}
          NATIVE_BROWSER: ${{ matrix.browser }}
          NATIVE_OUT: /tmp/gnamma-native-print-${{ matrix.browser }}-${{ matrix.edition }}
        run: |
          node --check daruri/qa/stage2_shootout/ultimate_native_print_browser.cjs
          /usr/bin/time -v node daruri/qa/stage2_shootout/ultimate_native_print_browser.cjs
      - name: Independent browser-printed PDF syntax and link/content integrity (Chromium only)
        if: matrix.browser == 'chromium'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          pdf=/tmp/gnamma-native-print-${{ matrix.browser }}-${{ matrix.edition }}/daruri-${{ matrix.edition }}-native-print-QAONLY.pdf
          qpdf --check "$pdf"
          python daruri/qa/stage2_shootout/ultimate_pdf_qa.py "$pdf" \
            daruri/qa/stage2_shootout/runtime_ultimate/${{ matrix.edition }}.source.json \
            /tmp/gnamma-native-print-${{ matrix.browser }}-${{ matrix.edition }}/native-pdf-qa.json
          if [ '${{ matrix.edition }}' = scholarly ]; then
            python daruri/qa/stage2_shootout/ultimate_semantic_fidelity.py "$pdf" \
              daruri/qa/stage2_shootout/runtime_ultimate/scholarly.html \
              daruri/qa/stage2_shootout/runtime_ultimate/scholarly.source.json \
              /tmp/gnamma-native-print-chromium-scholarly/content-fidelity.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daruri-plain-native-css-${{ matrix.browser }}-${{ matrix.edition }}-NONRELEASE
          path: /tmp/gnamma-native-print-${{ matrix.browser }}-${{ matrix.edition }}
          if-no-files-found: warn
          retention-days: 7