name: Daruri Vivliostyle PDF full 625-note 157-article Scholarly browser R&D (NONRELEASE)
on:
  push:
    branches: [research/daruri-browser-pdf-engine-shootout-20261025]
    paths:
      - '.github/workflows/daruri-vivliostyle-pdf-full-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-full-scholarship:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Produce full ORIGINAL CURRENT Scholarly HTML (not published PDF)
        run: |
          python -m pip install -q beautifulsoup4 PyMuPDF==1.26.7
          python daruri/qa/stage2_shootout/ultimate_html_fixture.py \
            daruri/qa/stage2_shootout/runtime_ultimate scholarly
          cp daruri/qa/stage2_shootout/runtime_ultimate/scholarly.html \
            daruri/qa/stage2_shootout/runtime_ultimate/scholarly.source.txt
      - name: Install Vivliostyle-to-PDF prototype and Playwright Chromium
        run: |
          npm install --prefix daruri/qa/stage2_shootout --no-package-lock --no-audit --no-fund
          cd daruri/qa/stage2_shootout
          npx playwright install --with-deps --only-shell chromium
          cd ../../..
          mkdir -p fonts
          cp daruri/qa/stage2_shootout/node_modules/vivliostyle-pdf/public/fonts/*.ttf fonts/
      - name: Generate genuine full Scholarly book as direct browser PDF Blob
        env:
          BENCH_BROWSER: chromium
          BENCH_SOURCE: scholarly
          BENCH_OUT: /tmp/gnamma-vivliostyle-scholarly-chromium
        run: |
          node --check daruri/qa/stage2_shootout/test_vivliostyle_pdf_browser.cjs
          /usr/bin/time -v node daruri/qa/stage2_shootout/test_vivliostyle_pdf_browser.cjs
      - name: PDF reader compatibility, original scholarly links and Arabic extraction
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          pdf=/tmp/gnamma-vivliostyle-scholarly-chromium/daruri-scholarly-vivliostyle-pdf-NONRELEASE.pdf
          set +e
          qpdf --check "$pdf" > /tmp/gnamma-vivliostyle-scholarly-chromium/qpdf-check.txt 2>&1
          qexit=$?
          pdftotext -layout "$pdf" /tmp/gnamma-vivliostyle-scholarly-chromium/poppler-text.txt 2> /tmp/gnamma-vivliostyle-scholarly-chromium/poppler-errors.txt
          pexit=$?
          set -e
          echo "VIVLIOSTYLE_QPDF_EXIT=$qexit POPPLER_EXIT=$pexit"
          head -45 /tmp/gnamma-vivliostyle-scholarly-chromium/qpdf-check.txt
          python - <<'PY'
          from pathlib import Path
          import fitz,json,re,collections
          fitz.TOOLS.mupdf_display_errors(False)
          p=Path('/tmp/gnamma-vivliostyle-scholarly-chromium')
          doc=fitz.open(p/'daruri-scholarly-vivliostyle-pdf-NONRELEASE.pdf')
          kinds=collections.Counter(l['kind'] for page in doc for l in page.get_links())
          text=(p/'poppler-text.txt').read_text('utf8',errors='replace')
          result={'pages':len(doc),'outlines':len(doc.get_toc()),'named_destinations':len(doc.resolve_names()),
           'pdf_links_by_kind':dict(kinds),'has_original_lexicon_text':'ibāḥa' in text,
           'contains_english_authorial_text':'In the name' in text,
           'note_source_refs_printed':'Qur' in text or 'Q1' in text,
           'full_153_term_headword_links_examined':False,
           'full_157_article_text_equal_checked':False,
           'pdf_qpdf_exit_code':int((p/'qpdf-check.txt').read_text().find('No syntax or stream')==-1)}
          (p/'full-native-audit.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          print('GNAMMA_VIVLIOSTYLE_FULL_PDF_AUDIT',json.dumps(result,ensure_ascii=False))
          PY
          if [ "$qexit" -ne 0 ] || [ "$pexit" -ne 0 ]; then
            echo '::error::Vivliostyle experimental full PDF fails native compatibility checks; retain NONRELEASE artifact'; exit 2
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daruri-vivliostyle-full-scholarly-client-blob-NONRELEASE
          path: /tmp/gnamma-vivliostyle-scholarly-chromium
          if-no-files-found: warn
          retention-days: 14
