name: Farghani 1876 Princeton facsimile acquisition
on:
  workflow_dispatch:
  push:
    paths:
      - "texts/al-farghani/muntaha-al-madarik/editorial/FACSIMILE_INGEST_TRIGGER.md"

permissions:
  contents: write

concurrency:
  group: farghani-i1876-facsimile
  cancel-in-progress: false

jobs:
  capture-public-domain-image-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Acquire original Princeton/NYU image service and derive review JPEGs
        run: |
          python -m pip install --quiet Pillow PyMuPDF
          python tools/farghani_iiif_ingest.py
      - name: Preserve URL, SHA provenance, contact sheets and source images
        if: always()
        run: |
          git config user.name "GNAMMA critical-edition evidence bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add texts/al-farghani/muntaha-al-madarik/facsimile-I1876
          if ! git diff --cached --quiet; then
            git commit -m "Farghani I1876: source scan images and checked provenance (not verified variants)"
            git push origin HEAD:master
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: farghani-i1876-source-review
          path: texts/al-farghani/muntaha-al-madarik/facsimile-I1876/
          if-no-files-found: warn
          retention-days: 30
