name: Daruri current-master Focus Contents and toolbar regression
on:
  pull_request:
    paths:
      - 'daruri/headerless-navigation.css'
      - 'daruri/headerless-navigation.js'
      - 'daruri/qa/verify-current-focus-contents-browser.cjs'
      - 'daruri/qa/verify-selection-context-browser.cjs'
      - 'daruri/qa/verify-copy-visual-live-browser.cjs'
      - 'daruri/copy-links.js'
      - 'daruri/visuals-controls.js'
      - 'daruri/reading-desk.js'
      - 'daruri/gnamma-word-context.js'
      - '.github/workflows/daruri-focus-contents-regression.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {contents: read}
jobs:
  focus-contents-current-master:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate script
        run: |
          node --check daruri/qa/verify-current-focus-contents-browser.cjs
          node --check daruri/qa/verify-selection-context-browser.cjs
          node --check daruri/qa/verify-copy-visual-live-browser.cjs
      - name: Disable unrelated inaccessible apt repository
        run: |
          for source in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            [ -f "$source" ] || continue
            if grep -q 'packages.microsoft.com/ubuntu/24.04/prod' "$source"; then
              sudo mv "$source" "$source.disabled"
            fi
          done
      - name: Install local Chromium and WebKit browsers
        run: |
          npm install --no-save --prefix daruri/qa playwright@1.56.1
          npx --prefix daruri/qa playwright install --with-deps chromium webkit
      - name: Test 48 ordinary, Focus and Continuous scenarios against candidate patch
        run: node daruri/qa/verify-current-focus-contents-browser.cjs
      - name: Test safe word taps and bottom selection actions in both browser engines
        if: always()
        run: node daruri/qa/verify-selection-context-browser.cjs
      - name: Check Copy scope follows scrolling only without a selection and Visuals appearance is reachable
        if: always()
        run: node daruri/qa/verify-copy-visual-live-browser.cjs
      - name: Preserve independent screenshots and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-master-focus-layout-regression
          path: |
            daruri/qa/focus-fix-artifacts/
            daruri/qa/copy-visual-artifacts/
          retention-days: 14
          if-no-files-found: warn
