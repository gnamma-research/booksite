name: Daruri original 414-source opening HTML-to-vector-PDF QA (NONRELEASE)
on:
  push:
    branches: [research/daruri-browser-outline-semantic-20261023]
    paths:
      - 'daruri/browser-html-pdf/vector-all-openings.html'
      - 'daruri/browser-html-pdf/vector-all-openings.mjs'
      - 'daruri/browser-html-pdf/test_vector_all_openings.cjs'
      - 'daruri/browser-html-pdf/verify_vector_all_openings.py'
      - '.github/workflows/daruri-browser-414-openings.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daruri-414-openings-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-corpus-openings:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build unchanged entire canonical source fixture
        run: python daruri/browser-html-pdf/build_fixture.py --out daruri/browser-html-pdf/fixture.json
      - name: Install pinned local HTML browser and glyph/vector dependencies
        run: |
          npm install --no-save --no-package-lock --prefix daruri/browser-html-pdf
          cd daruri/browser-html-pdf
          if [ '${{ matrix.browser }}' = chromium ]; then
            npx playwright install --with-deps --only-shell chromium
          else
            npx playwright install --with-deps webkit
          fi
      - name: Syntax and native audit preflight
        run: |
          node --check daruri/browser-html-pdf/vector-all-openings.mjs
          node --check daruri/browser-html-pdf/test_vector_all_openings.cjs
          python -m py_compile daruri/browser-html-pdf/verify_vector_all_openings.py
      - name: Normal browser directly builds 414 original Arabic opening vector PDF pages
        env:
          GNAMMA_414_BROWSER: ${{ matrix.browser }}
          GNAMMA_414_OUTPUT: /tmp/gnamma-414-${{ matrix.browser }}
        run: node daruri/browser-html-pdf/test_vector_all_openings.cjs
      - name: Native 414-phrase source/geometry/clean-copy QA (must really pass)
        run: |
          python -m pip install -q 'PyMuPDF==1.26.7'
          python daruri/browser-html-pdf/verify_vector_all_openings.py \
            --pdf /tmp/gnamma-414-${{ matrix.browser }}/daruri-vector-original-414-openings-NONRELEASE.pdf \
            --fixture daruri/browser-html-pdf/fixture.json \
            --evidence /tmp/gnamma-414-${{ matrix.browser }}/browser-evidence.json \
            --report /tmp/gnamma-414-${{ matrix.browser }}/native-414-evidence.json
      - name: Preserve evidence but do not publish an edition
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daruri-vector-original-openings-${{ matrix.browser }}-NONRELEASE
          path: /tmp/gnamma-414-${{ matrix.browser }}/
          if-no-files-found: warn
          retention-days: 14