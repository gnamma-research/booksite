name: Qawtaw10 public release verification
on:
  push:
    branches: [master]
    paths: ['.github/workflows/qawtaw10-live-check.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qawtaw10-public-verification
  cancel-in-progress: false
jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: texts/al-turka/qawaid-al-tawhid
          fetch-depth: 1
      - name: Verify actual public assets against the committed release
        run: |
          python - <<'PY'
          import urllib.request,hashlib,json,pathlib,time,os,concurrent.futures,datetime
          p=pathlib.Path('texts/al-turka/qawaid-al-tawhid')
          base='https://gnamma-research.github.io/booksite/'+str(p)+'/'
          sha=os.environ['GITHUB_SHA']
          names=['index.html','commentary.html','clause-review.html','textual-decisions.html','editorial/QAWTAW8_FINAL_FOURTEEN_ADJUDICATIONS.md','editorial/QAWTAW10_SOURCE_RECOVERY_2026-11-12.md','qa/qawtaw8-final14-dispositions.json','qa/qawtaw10-final-status.json','data/commentary-corpus.json','qa/clause-ledger.json','pdf/manifest.json','downloads/Tamhid_Complete_Commentary_Reading_Edition.html']
          manifest=json.loads((p/'pdf/manifest.json').read_text())
          names += ['pdf/'+r['filename'] for r in manifest['files']]
          expected={n:hashlib.sha256((p/n).read_bytes()).hexdigest() for n in names}
          def fetch(n):
              req=urllib.request.Request(base+n+'?qawtaw10='+sha,headers={'Cache-Control':'no-cache','User-Agent':'GNAMMA-release-verification'})
              with urllib.request.urlopen(req,timeout=45) as r:
                  body=r.read();code=r.status
              return n,code,hashlib.sha256(body).hexdigest(),len(body)
          history=[];verified={};last=[]
          for attempt in range(1,25):
              remaining=[n for n in names if n not in verified];last=[]
              with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
                  pending={pool.submit(fetch,n):n for n in remaining}
                  for f in concurrent.futures.as_completed(pending):
                      name=pending[f]
                      try:
                          n,code,h,size=f.result()
                          if code==200 and h==expected[n]:verified[n]={'url':base+n,'status':code,'sha256':h,'bytes':size}
                          else:last.append({'file':n,'status':code,'expected':expected[n],'received':h})
                      except Exception as e:last.append({'file':name,'error':str(e)})
              history.append({'attempt':attempt,'verifiedCount':len(verified),'remaining':last})
              print(json.dumps(history[-1]),flush=True)
              if len(verified)==len(names):break
              if attempt<24:time.sleep(15)
          report={'date':'2026-11-11','checkedAtUTC':datetime.datetime.now(datetime.timezone.utc).isoformat(),'expectedCommit':sha,'workflowRun':os.environ['GITHUB_RUN_ID'],'liveDeploymentVerified':len(verified)==len(names),'publicReader':base,'verifiedAssets':verified,'attempts':history,'scope':'Byte-for-byte checks of actual public reader HTML, compiled corpus, canonical comparison ledger, single-file reader, manifest and all five PDF binaries. Browser interaction is covered separately by branch release tests.'}
          pathlib.Path('qawtaw10-live-publication-check.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          assert report['liveDeploymentVerified'],last
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qawtaw10-live-publication-check
          path: qawtaw10-live-publication-check.json
          retention-days: 30
