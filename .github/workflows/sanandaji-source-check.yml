name: Sanandaji public source discovery
on:
  push:
    branches: ['sanandaji/vol1-all-register-2026-11-10']
    paths: ['.github/workflows/sanandaji-source-check.yml']
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public digitization pages without executing their content
        shell: python
        run: |
          import urllib.request, urllib.parse, re, html, json, pathlib
          urls=['https://mosannefat.net/books/31006','https://www.aswajabooks.com/2025/08/taqribul-marom-fi-syarhi-tahdzibil-kalam-lit-taftazani.html','https://archive.org/advancedsearch.php?q='+urllib.parse.quote('title:"تقريب المرام"')+'&output=json']
          out=pathlib.Path('source-discovery');out.mkdir()
          for i,url in enumerate(urls):
            print('SOURCE',url)
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (scholarly source verification)'})
              raw=urllib.request.urlopen(req,timeout=30).read(4000000)
              text=raw.decode('utf-8','replace');(out/('source-'+str(i)+'.txt')).write_text(text)
              if 'advancedsearch' in url:
                j=json.loads(text)
                print(json.dumps(j.get('response',{}).get('docs',[]),ensure_ascii=False)[:45000])
              else:
                links=re.findall(r'(?:href|src)=[\"\x27]([^\"\x27]+)',text)
                for link in links:
                  link=html.unescape(urllib.parse.urljoin(url,link))
                  if any(s in link.lower() for s in ['archive.org','drive.google','mediafire','download','.pdf']):print('LINK',link)
              print('BYTES',len(raw))
            except Exception as e:print('ERROR',type(e).__name__,str(e)[:500])
      - uses: actions/upload-artifact@v4
        with:
          name: sanandaji-public-source-discovery
          path: source-discovery/
          retention-days: 7
