name: Daruri ActualText temporary overlay output (NON-RELEASE)
on:
  push:
    branches: [experiment/daruri-actualtext-source-20261022]
    paths:
      - .github/workflows/daruri-actualtext-overlay-input.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  temporary-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check PyMuPDF==1.26.7 fonttools==4.67.0
      - run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Build temporary unchanged-layout source overlay
        run: |
          python daruri/qa/experimental_original_arabic_unicode.py \
            --input daruri/editions/reading/daruri-reading-arabic-titles-off.pdf \
            --map daruri/editions/maps/daruri-reading-arabic-titles-off.pdf.json \
            --font daruri/build/fonts/NotoNaskhArabic-Regular.ttf \
            --output /tmp/daruri-pr49-temporary-overlay.pdf \
            --limit 414 --diagnostic
      - uses: actions/upload-artifact@v4
        with:
          name: daruri-pr49-temporary-unpublished-overlay
          path: /tmp/daruri-pr49-temporary-overlay.pdf
          retention-days: 7
