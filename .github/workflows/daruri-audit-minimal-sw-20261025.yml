name: Daruri WebKit minimal service-worker capability control (nonrelease)
on:
  push:
    branches: [audit/daruri-cache-upgrade-20261025]
    paths:
      - 'daruri/qa/verify-minimal-webkit-sw.cjs'
      - '.github/workflows/daruri-audit-minimal-sw-20261025.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  simple-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Disable unrelated unavailable apt source
        run: |
          for source in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            [ -f "$source" ] || continue
            if grep -q 'packages.microsoft.com/ubuntu/24.04/prod' "$source"; then sudo mv "$source" "$source.disabled"; fi
          done
      - name: Install Chromium/WebKit
        run: |
          npm install --no-save --prefix daruri/qa playwright@1.56.1
          npx --prefix daruri/qa playwright install --with-deps chromium webkit
      - name: Test minimal worker activation and controlled reload
        run: node daruri/qa/verify-minimal-webkit-sw.cjs
      - name: Archive browser worker capability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daruri-webkit-minimal-service-worker-capability
          path: daruri/qa/cache-audit-artifacts/minimal-worker-control.json
          retention-days: 14
          if-no-files-found: warn
