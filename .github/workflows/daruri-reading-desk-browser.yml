name: Daruri Reading Desk browser interaction QA

on:
  push:
    branches: [master, qa/reading-desk-touch-interaction-20261021]
    paths:
      - '.github/workflows/daruri-reading-desk-browser.yml'
      - 'daruri/qa/verify-reading-desk-real-browser.cjs'
      - 'daruri/qa/verify-popup-scroll-browser.cjs'
      - 'daruri/qa/verify-other-modal-scroll.cjs'
      - 'daruri/qa/verify-reading-desk-recovery-search.cjs'
      - 'daruri/qa/verify-contextual-bookmarks.cjs'
      - 'daruri/reading-mode-controls.js'
      - 'daruri/reading-mode-controls.css'
      - 'daruri/backup-transfer.js'
      - 'daruri/backup-transfer.css'
      - 'daruri/google-drive-config.js'
      - 'daruri/qa/verify-backup-transfer-browser.cjs'
      - 'daruri/qa/verify-backup-transfer-ui.cjs'
      - 'daruri/qa/verify-backup-transfer-google-mock.cjs'
      - 'daruri/reading-desk.js'
      - 'daruri/reading-desk.css'
      - 'daruri/index.html'
  pull_request:
    paths:
      - '.github/workflows/daruri-reading-desk-browser.yml'
      - 'daruri/qa/verify-reading-desk-real-browser.cjs'
      - 'daruri/qa/verify-popup-scroll-browser.cjs'
      - 'daruri/qa/verify-other-modal-scroll.cjs'
      - 'daruri/qa/verify-reading-desk-recovery-search.cjs'
      - 'daruri/qa/verify-contextual-bookmarks.cjs'
      - 'daruri/reading-mode-controls.js'
      - 'daruri/reading-mode-controls.css'
      - 'daruri/backup-transfer.js'
      - 'daruri/backup-transfer.css'
      - 'daruri/google-drive-config.js'
      - 'daruri/qa/verify-backup-transfer-browser.cjs'
      - 'daruri/qa/verify-backup-transfer-ui.cjs'
      - 'daruri/qa/verify-backup-transfer-google-mock.cjs'
      - 'daruri/reading-desk.js'
      - 'daruri/reading-desk.css'
      - 'daruri/index.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webkit-chromium:
    name: Real DOM and touch-like interactions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exclude unavailable Microsoft apt source on GitHub runner
        run: |
          for source in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            [ -f "$source" ] || continue
            if grep -q 'packages.microsoft.com/ubuntu/24.04/prod' "$source"; then
              sudo mv "$source" "$source.disabled"
            fi
          done
      - name: Install browser test dependencies
        run: |
          npm install --no-save --prefix daruri/qa playwright@1.56.1
          # Install pinned browsers without an unnecessary apt update on hosted runners.
          npx --prefix daruri/qa playwright install chromium webkit
          # Repair native dependencies only when a real browser launch reports them missing.
          node -e "const {chromium,webkit}=require('./daruri/qa/node_modules/playwright');(async()=>{for(const b of [chromium,webkit]){const browser=await b.launch({headless:true,...(b===chromium?{args:['--no-sandbox']}:{})});await browser.close()}})().catch(e=>{console.error(e);process.exit(1)})" || {
            echo "Browser runtime dependencies missing; installing pinned Linux dependencies"
            timeout 180s npx --prefix daruri/qa playwright install-deps chromium webkit
          }
      - name: Verify one-scroll scholarly popups and frozen reading page in Chromium / mobile WebKit
        run: node daruri/qa/verify-popup-scroll-browser.cjs
      - name: Verify Search, Reading Desk, backup and other overlays use one scroll lock
        run: node daruri/qa/verify-other-modal-scroll.cjs
      - name: Exercise actual reader in mobile WebKit and Chromium
        run: node daruri/qa/verify-reading-desk-real-browser.cjs
      - name: Verify deletion recovery, Arabic search and keyboard notes
        run: node daruri/qa/verify-reading-desk-recovery-search.cjs
      - name: Verify contextual reference navigation in mobile and desktop browsers
        run: node daruri/qa/verify-contextual-bookmarks.cjs
      - name: Verify manual backup, selective restoration and mocked Google Drive
        run: node daruri/qa/verify-backup-transfer-browser.cjs
      - name: Preserve screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reading-desk-browser-screenshots
          path: |
            daruri/qa/reading-desk-browser-artifacts/
            daruri/qa/popup-scroll-artifacts/
          if-no-files-found: ignore
          retention-days: 7
