name: Daruri 280-2560px toolbar geometry audit (nonrelease)
on:
  push:
    branches: [audit/daruri-cache-upgrade-20261025]
    paths:
      - 'daruri/qa/verify-extra-widths-browser.cjs'
      - '.github/workflows/daruri-audit-extreme-widths-20261025.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  widths:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Disable unrelated apt source
        run: |
          for source in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            [ -f "$source" ] || continue
            if grep -q 'packages.microsoft.com/ubuntu/24.04/prod' "$source"; then sudo mv "$source" "$source.disabled"; fi
          done
      - run: |
          npm install --no-save --prefix daruri/qa playwright@1.56.1
          npx --prefix daruri/qa playwright install --with-deps chromium webkit
      - name: Test 16 actual control hit layouts
        run: node daruri/qa/verify-extra-widths-browser.cjs
      - name: Keep extreme width findings and optional sub-320 cases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daruri-extra-width-hit-geometry
          path: daruri/qa/extra-width-audit/geometry.json
          retention-days: 14
          if-no-files-found: warn
