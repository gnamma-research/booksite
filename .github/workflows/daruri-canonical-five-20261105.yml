name: Daruri canonical five PDFs · scholarly source release
on:
  push:
    branches: [master]
    paths:
      - "daruri/edition-r3-20261020.js"
      - "daruri/build/build_editions.py"
      - "daruri/build/main_text.py"
      - "daruri/build/update_release.py"
      - "daruri/build/apply_escorial_review_20261105.py"
      - ".github/workflows/daruri-canonical-five-20261105.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daruri-canonical-five-public
  cancel-in-progress: false
jobs:
  regenerate-five:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PDF stack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcairo2 libpango-1.0-0 libpangocairo-1.0-0 libharfbuzz0b libfribidi0 fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install -r daruri/build/requirements.txt "pypdf==5.9.0" "PyMuPDF==1.26.7"
      - name: Validate canonical text and scholarly revision
        run: |
          node --check daruri/edition-r3-20261020.js
          python - <<'PY'
          import sys
          sys.path.insert(0, 'daruri/build')
          from build_editions import read_book
          book=read_book()
          sections={s['id']:s for s in book['sections']}
          assert len(sections)==259
          assert sum(len(s['segments']) for s in book['sections'])==416
          assert len(book['notes'])>=666
          assert len([n for n in book['notes'] if n['id'].startswith('CR20261105-')])==41
          assert 'In the latter case' not in ' '.join(s['en'] for s in sections[23]['segments'])
          assert 'is the error of supposing' not in ' '.join(s['en'] for s in sections[26]['segments'])
          print("Source and critical annotations validated")
          PY
      - name: Build five definitive site PDFs and check page links
        run: |
          python daruri/build/build_editions.py --output-dir /tmp/daruri-canonical-20261105
          python daruri/build/verify_structure.py --output-dir /tmp/daruri-canonical-20261105
          cp /tmp/daruri-canonical-20261105/daruri.pdf daruri/
          cp /tmp/daruri-canonical-20261105/daruri-study.pdf daruri/
          cp /tmp/daruri-canonical-20261105/daruri-english.pdf daruri/
          cp /tmp/daruri-canonical-20261105/daruri-arabic.pdf daruri/
          cp /tmp/daruri-canonical-20261105/daruri-arabic-vowelled.pdf daruri/
          cp /tmp/daruri-canonical-20261105/*.metadata.json daruri/build/release/
          python daruri/build/update_release.py --rebuilt-dir /tmp/daruri-canonical-20261105 --revision daruri-escorial-20261105 --edition-date 2026-11-05 --apply | tee daruri/build/release/release-update.json
          python daruri/build/update_release.py --rebuilt-dir /tmp/daruri-canonical-20261105 --revision daruri-escorial-20261105 --edition-date 2026-11-05 --check
          python daruri/build/export_portable_source.py --output-dir /tmp/daruri-escorial-source
          cp /tmp/daruri-escorial-source/Daruri_Portable_Scholarly_Source.zip daruri/source/
          cp /tmp/daruri-escorial-source/source-export-report.json daruri/source/
      - name: Save validated artifacts and release only on current source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          RELEASE_ROOT="$RUNNER_TEMP/daruri-canonical-five"
          mkdir -p "$RELEASE_ROOT"
          for f in daruri.pdf daruri-study.pdf daruri-english.pdf daruri-arabic.pdf daruri-arabic-vowelled.pdf pdf-editions-manifest.json index.html download-bundle.js sw.js; do
            cp "daruri/$f" "$RELEASE_ROOT/$f"
          done
          mkdir -p "$RELEASE_ROOT/release" "$RELEASE_ROOT/source"
          cp daruri/build/release/*.metadata.json "$RELEASE_ROOT/release/"
          cp daruri/build/release/release-update.json "$RELEASE_ROOT/release/"
          cp daruri/source/Daruri_Portable_Scholarly_Source.zip "$RELEASE_ROOT/source/"
          cp daruri/source/source-export-report.json "$RELEASE_ROOT/source/"
          for attempt in 1 2 3 4; do
            git fetch --quiet origin master
            TARGET_SHA="$(git rev-parse origin/master)"
            if [ "$TARGET_SHA" != "$GITHUB_SHA" ] && ! git diff --quiet "$GITHUB_SHA" "$TARGET_SHA" -- daruri/edition-r3-20261020.js daruri/build/ daruri/index.html daruri/daruri.pdf daruri/daruri-study.pdf daruri/daruri-english.pdf daruri/daruri-arabic.pdf daruri/daruri-arabic-vowelled.pdf; then
              echo "::error::New canonical Daruri source or PDF publication since build; refusing stale artifacts"
              exit 1
            fi
            git reset --hard "$TARGET_SHA"
            for f in daruri.pdf daruri-study.pdf daruri-english.pdf daruri-arabic.pdf daruri-arabic-vowelled.pdf pdf-editions-manifest.json index.html download-bundle.js sw.js; do
              cp "$RELEASE_ROOT/$f" "daruri/$f"
            done
            cp "$RELEASE_ROOT/release/"* daruri/build/release/
            cp "$RELEASE_ROOT/source/"* daruri/source/
            git add daruri/index.html daruri/daruri.pdf daruri/daruri-study.pdf daruri/daruri-english.pdf daruri/daruri-arabic.pdf daruri/daruri-arabic-vowelled.pdf
            git add daruri/pdf-editions-manifest.json daruri/download-bundle.js daruri/sw.js daruri/build/release/ daruri/source/
            if git diff --cached --quiet; then
              echo "Canonical PDFs already current"
              exit 0
            fi
            git commit -m "Publish five Daruri source-checked PDFs and section navigation [skip ci]"
            if git push origin HEAD:master; then
              echo "Published canonical PDFs with verified section page maps"
              exit 0
            fi
          done
          echo "::error::Concurrent publishing prevented safe canonical PDF update"
          exit 1
      - name: Keep build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daruri-canonical-five-20261105-QA
          path: |
            /tmp/daruri-canonical-20261105/structure-verification.json
            daruri/build/release/release-update.json
          if-no-files-found: warn
