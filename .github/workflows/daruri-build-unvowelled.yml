name: Build unvowelled bilingual Daruri Reading PDFs
on:
  workflow_dispatch:
  push:
    branches: [ux/daruri-editions-clarity-20261021]
    paths:
      - ".github/workflows/daruri-build-unvowelled.yml"
      - "daruri/build/print_editions.py"
      - "daruri/build/publish_editions.py"
      - "daruri/build/publish_unvowelled_reading.py"
permissions:
  contents: write
concurrency:
  group: daruri-unvowelled-draft
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install required PDF rendering libraries
        run: |
          python -m pip install --disable-pip-version-check "weasyprint>=68,<69" "PyMuPDF>=1.26,<1.28" "pypdf>=5,<7"
      - name: Build and verify only two unvowelled bilingual PDFs
        run: |
          python daruri/build/publish_unvowelled_reading.py
          node daruri/qa/verify-ready-editions.js
      - name: Publish verified new PDFs and updated manifest to this draft branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            daruri/editions/reading/daruri-reading-bilingual-unvowelled-titles-off.pdf \
            daruri/editions/reading/daruri-reading-bilingual-unvowelled-titles-on.pdf \
            daruri/editions/manifest.json
          if git diff --cached --quiet; then
            echo "Identical PDFs already published; no commit necessary."
          else
            git commit -m "Publish SHA-verified unvowelled bilingual Reading editions"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Upload final verified PDFs and manifest for review
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: daruri-reading-bilingual-unvowelled
          path: |
            daruri/editions/reading/daruri-reading-bilingual-unvowelled-titles-off.pdf
            daruri/editions/reading/daruri-reading-bilingual-unvowelled-titles-on.pdf
            daruri/editions/manifest.json
          retention-days: 14
