name: Farghani original IIIF high-resolution selected scans
on:
  workflow_dispatch:
  push:
    paths:
      - "texts/al-farghani/muntaha-al-madarik/editorial/HIRES_FACSIMILE_TRIGGER.md"
permissions:
  contents: write
concurrency:
  group: farghani-hires-iiif-original
  cancel-in-progress: false
jobs:
  highres-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Read primary IIIF v3 image service for the exact historic printed leaves
        run: |
          python -m pip install --quiet Pillow
          python tools/farghani_iiif_selected_hi.py
      - name: Commit any source images and manifest without discarding concurrent changes
        if: always()
        run: |
          git config user.name "GNAMMA source witness librarian"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add texts/al-farghani/muntaha-al-madarik/facsimile-I1876-hires
          if ! git diff --cached --quiet; then
            git commit -m "Farghani: IIIF high-resolution source evidence and provenance for selected cruxes"
            for attempt in 1 2 3 4; do
              git fetch origin master
              git rebase origin/master
              if git push origin HEAD:master; then
                exit 0
              fi
              sleep 2
            done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: farghani-i1876-hires-selected
          path: texts/al-farghani/muntaha-al-madarik/facsimile-I1876-hires/
          retention-days: 30
          if-no-files-found: warn
