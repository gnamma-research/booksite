name: Daruri Research archive and Editions real browser audit (nonrelease)
on:
  push:
    branches: [audit/daruri-reader-lifecycle-20261025]
    paths:
      - '.github/workflows/daruri-audit-editions-browser-20261025.yml'
      - 'daruri/editions-selector.js'
      - 'daruri/personal-export.js'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  real-editions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Disable unrelated unavailable apt source
        run: |
          for source in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            [ -f "$source" ] || continue
            if grep -q 'packages.microsoft.com/ubuntu/24.04/prod' "$source"; then sudo mv "$source" "$source.disabled"; fi
          done
      - name: Install Chromium
        run: |
          npm install --no-save --prefix daruri/qa playwright@1.56.1
          npx --prefix daruri/qa playwright install --with-deps chromium
      - name: Verify real source ZIP SHA, staged tabs and local personal PDF bridge
        shell: bash
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 > /tmp/daruri-audit-editions-http.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          for i in {1..40}; do
            if curl --silent --fail http://127.0.0.1:8123/daruri/ > /dev/null; then break; fi
            sleep 0.25
          done
          node daruri/qa/verify-published-selector-browser.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daruri-editions-source-real-browser
          path: |
            daruri/qa/*editions*
            daruri/qa/*selector*
          retention-days: 14
          if-no-files-found: warn
