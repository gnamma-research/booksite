name: Qawtaw16 live edition byte-parity verification
on:
  push:
    branches: [master]
    paths: ['.github/workflows/qawtaw16-live-acceptance.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: texts/al-turka/qawaid-al-tawhid
      - name: Verify all fifteen actual GitHub Pages source, reader and PDF files byte-for-byte
        run: |
          python - <<'PY'
          import concurrent.futures,hashlib,json,os,pathlib,time,urllib.request
          root=pathlib.Path('texts/al-turka/qawaid-al-tawhid')
          base='https://gnamma-research.github.io/booksite/'+str(root)+'/'
          files=[
            'index.html','commentary.html','textual-decisions.html','qawaid-study.js',
            'data/units.js','data/commentary-corpus.json','qa/clause-ledger.json',
            'qa/qawtaw16-final-acceptance.json','editorial/QAWTAW16_SOURCE_SCOPED_FINAL_AUDIT_2026-11-12.md',
            'pdf/manifest.json','pdf/qawaid-bilingual-reading.pdf','pdf/qawaid-english-reading.pdf',
            'pdf/qawaid-arabic-reading.pdf','pdf/qawaid-bilingual-study.pdf',
            'pdf/qawaid-bilingual-reference.pdf'
          ]
          expected={f:hashlib.sha256((root/f).read_bytes()).hexdigest() for f in files}
          confirmed={};last=[]
          for attempt in range(1,26):
              remaining=[f for f in files if f not in confirmed]
              if not remaining:break
              last=[]
              def fetch(f):
                  req=urllib.request.Request(base+f+'?qawtaw16='+os.environ['GITHUB_SHA'],headers={'Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=35) as r:
                      return r.status,hashlib.sha256(r.read()).hexdigest()
              with concurrent.futures.ThreadPoolExecutor(max_workers=6) as executor:
                  future={executor.submit(fetch,f):f for f in remaining}
                  for task in concurrent.futures.as_completed(future):
                      f=future[task]
                      try:
                          status,digest=task.result()
                          if status==200 and digest==expected[f]:confirmed[f]={'http':200,'sha256':digest}
                          else:last.append({'file':f,'http':status,'hashMatch':digest==expected[f]})
                      except Exception as e:last.append({'file':f,'error':str(e)})
              print(json.dumps({'attempt':attempt,'verified':len(confirmed),'total':len(files),'pending':last},ensure_ascii=False),flush=True)
              if len(confirmed)==len(files):break
              time.sleep(8)
          report={'success':len(confirmed)==len(files),'verifiedFiles':confirmed,'pending':last,
                  'editionScope':'171 bilingual units, 5520 source segments, five Qawtaw16 PDFs',
                  'independentHistoricalManuscriptCollations':0,'recoveredOriginalQT059Words':0}
          pathlib.Path('qawtaw16-public-verification.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          assert report['success'], 'Public site does not yet byte-match this accepted scholarly release'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qawtaw16-public-verification
          path: qawtaw16-public-verification.json
          retention-days: 30
