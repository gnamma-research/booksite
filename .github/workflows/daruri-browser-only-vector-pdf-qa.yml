name: Daruri genuine browser-only HTML to selectable PDF proof (NONRELEASE)
on:
  push:
    branches: [research/daruri-browser-only-pdf-20261023]
    paths:
      - 'daruri/qa/build_browser_pdf_canonical_fixture.py'
      - 'daruri/qa/browser_pdf_vector_probe.html'
      - 'daruri/qa/verify_true_browser_pdf.cjs'
      - 'daruri/qa/audit_browser_pdf_vector.py'
      - '.github/workflows/daruri-browser-only-vector-pdf-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daruri-true-browser-pdf-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-native:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: chromium
            mode: excerpt
            port: 8904
          - engine: webkit
            mode: excerpt
            port: 8905
          - engine: chromium
            mode: english-full
            port: 8906
          - engine: chromium
            mode: bilingual-full
            port: 8907
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PINNED browser-only HTML-to-vector-PDF engine and real browsers
        run: |
          npm install --no-save --no-package-lock --prefix daruri/qa \
            jsafa-pdf@0.1.1 playwright@1.56.1
          cd daruri/qa
          if [ '${{ matrix.engine }}' = chromium ]; then
            npx playwright install --with-deps --only-shell chromium
          else
            npx playwright install --with-deps webkit
          fi
      - name: Install read-only independent native PDF inspection libraries
        run: python -m pip install --disable-pip-version-check 'PyMuPDF==1.26.7' 'pypdfium2==5.8.0'
      - name: Recreate source Arabic/English test corpus from the immutable reader snapshot
        run: python daruri/qa/build_browser_pdf_canonical_fixture.py
      - name: Generate actual PDF bytes INSIDE browser JavaScript (not page.pdf or print dialog)
        env:
          GN_BROWSER: ${{ matrix.engine }}
          GN_PDF_SCENARIO: ${{ matrix.mode }}
          GN_BROWSER_PORT: ${{ matrix.port }}
          GN_PDF_OUT: /tmp/daruri-native-browser/${{ matrix.engine }}-${{ matrix.mode }}
        run: node daruri/qa/verify_true_browser_pdf.cjs
      - name: Independently audit real selectable Arabic and link targets using MuPDF/PDFium
        run: |
          python daruri/qa/audit_browser_pdf_vector.py \
            --pdf /tmp/daruri-native-browser/${{ matrix.engine }}-${{ matrix.mode }}/daruri-${{ matrix.engine }}-${{ matrix.mode }}-NONRELEASE.pdf \
            --canonical-fixture daruri/qa/browser_pdf_canonical_fixture.json \
            --browser-report /tmp/daruri-native-browser/${{ matrix.engine }}-${{ matrix.mode }}/browser-${{ matrix.engine }}-${{ matrix.mode }}-evidence.json \
            --output /tmp/daruri-native-browser/${{ matrix.engine }}-${{ matrix.mode }}/independent-PDF-engine-qa.json
      - name: Save actual browser-generated PDF + first-page evidence for visual inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Daruri-REAL-browser-HTML-to-PDF-${{ matrix.engine }}-${{ matrix.mode }}-NONRELEASE
          path: /tmp/daruri-native-browser/${{ matrix.engine }}-${{ matrix.mode }}/
          retention-days: 12
          if-no-files-found: warn
