name: Daruri independent exhaustive browser audit
on:
  push:
    branches: [fix/daruri-focus-contents-and-toolbar-20261024]
    paths:
      - 'daruri/headerless-navigation.css'
      - 'daruri/headerless-navigation.js'
      - 'daruri/visuals-controls.js'
      - 'daruri/copy-links.js'
      - 'daruri/reading-desk.js'
      - 'daruri/gnamma-word-context.js'
      - 'daruri/sw.js'
      - 'daruri/qa/verify-*'
      - '.github/workflows/daruri-focus-contents-regression.yml'
      - '.github/workflows/daruri-exhaustive-browser-audit.yml'
  pull_request:
    paths:
      - 'daruri/qa/verify-exhaustive-reader-audit.cjs'
      - 'daruri/qa/verify-exhaustive-mode-offline.cjs'
      - '.github/workflows/daruri-exhaustive-browser-audit.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  independent-browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check daruri/qa/verify-exhaustive-reader-audit.cjs
          node --check daruri/qa/verify-exhaustive-mode-offline.cjs
      - name: Exclude inaccessible unrelated apt source
        run: |
          for source in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            [ -f "$source" ] || continue
            if grep -q 'packages.microsoft.com/ubuntu/24.04/prod' "$source"; then
              sudo mv "$source" "$source.disabled"
            fi
          done
      - name: Install independent audit dependencies
        run: |
          npm install --no-save --prefix daruri/qa playwright@1.56.1 @axe-core/playwright@4.10.2
          npx --prefix daruri/qa playwright install --with-deps chromium webkit
      - name: Test reader routes, responsiveness, JavaScript off, font failure, locales, blocked storage, search abuse and WCAG
        run: node daruri/qa/verify-exhaustive-reader-audit.cjs
      - name: Test ordinary Reading, Focus 2, Continuous, native fallback links and real offline cache
        if: always()
        run: node daruri/qa/verify-exhaustive-mode-offline.cjs
      - name: Upload evidence including screenshots, metrics and findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-daruri-browser-audit
          path: daruri/qa/audit-artifacts/
          retention-days: 14
          if-no-files-found: warn
