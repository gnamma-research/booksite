name: Tamhid standalone reader browser acceptance
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/tamhid-standalone-browser-qa.yml'
      - 'texts/al-turka/qawaid-al-tawhid/commentary.html'
      - 'texts/al-turka/qawaid-al-tawhid/commentary-reader.js'
      - 'texts/al-turka/qawaid-al-tawhid/downloads/Tamhid_Complete_Commentary_Reading_Edition.html'
      - 'texts/al-turka/qawaid-al-tawhid/qa/check-standalone-browser.py'
      - 'texts/al-turka/qawaid-al-tawhid/qa/finalize-reading-edition.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: texts/al-turka/qawaid-al-tawhid
      - name: Install browser emulators
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium webkit
      - name: Verify standalone edition with Chromium and WebKit
        run: python texts/al-turka/qawaid-al-tawhid/qa/check-standalone-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tamhid-standalone-browser-review
          path: texts/al-turka/qawaid-al-tawhid/qa/standalone-browser/
          retention-days: 7
