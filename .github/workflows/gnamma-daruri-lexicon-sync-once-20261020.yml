name: One-time Daruri historical lexicon sync
on:
  push:
    paths:
      - '.github/workflows/gnamma-daruri-lexicon-sync-once-20261020.yml'
permissions:
  contents: write
jobs:
  integrate:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Merge audited dictionary evidence without altering the UI
        run: python3 daruri/qa/sync_historical_lexicon_20261020.py
      - name: Commit reader-only dictionary content update
        shell: bash
        run: |
          if git diff --quiet -- daruri/index.html; then
            echo "Reader historical dictionary already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daruri/index.html
          git commit -m "Synchronize reviewed historical dictionary in current Daruri reader"
          git push origin HEAD:master
