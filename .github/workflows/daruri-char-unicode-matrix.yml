name: Daruri exploratory multi-edition CHAR Unicode build (NON-RELEASE)
on:
  push:
    branches: [experiment/daruri-actualtext-source-20261022]
    paths:
      - 'daruri/qa/experimental_original_char_unicode.py'
      - '.github/workflows/daruri-char-unicode-matrix.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: reading-arabic-vowelled
            input: editions/reading/daruri-reading-arabic-vowelled-titles-off.pdf
            map: editions/maps/daruri-reading-arabic-vowelled-titles-off.pdf.json
          - id: reading-bilingual
            input: editions/reading/daruri-reading-bilingual-titles-off.pdf
            map: editions/maps/daruri-reading-bilingual-titles-off.pdf.json
          - id: reading-bilingual-unvowelled
            input: editions/reading/daruri-reading-bilingual-unvowelled-titles-off.pdf
            map: editions/maps/daruri-reading-bilingual-unvowelled-titles-off.pdf.json
          - id: study-bilingual
            input: editions/study/daruri-study-bilingual-titles-off.pdf
            map: editions/maps/daruri-study-bilingual-titles-off.pdf.json
          - id: scholarly
            input: daruri.pdf
            map: personal-source-pango-maps/daruri.pdf.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check PyMuPDF==1.26.7
      - name: Build isolated candidate or report exact blocker
        run: |
          python daruri/qa/experimental_original_char_unicode.py \
            --input daruri/${{ matrix.input }} \
            --map daruri/${{ matrix.map }} \
            --output /tmp/daruri-${{ matrix.id }}-unicode-CANDIDATE.pdf
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: experimental-${{ matrix.id }}-unicode-NOT-RELEASE
          path: /tmp/daruri-${{ matrix.id }}-unicode-CANDIDATE.pdf
          retention-days: 3
