name: Qawtaw6 printed edition witnesses
on:
  push:
    branches: [qawtaw6-source-resolution-20261111]
    paths: ['.github/workflows/qawtaw6-edition-witnesses.yml']
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - run: |
          python -m pip install -q requests beautifulsoup4
          python - <<'PY'
          import requests,pathlib,json,hashlib,urllib.parse,concurrent.futures
          from bs4 import BeautifulSoup
          p=pathlib.Path('editions');p.mkdir()
          sources={'N':'https://alfeker.mediafire.com/file/4ceqbdibf67j7ds','R':'https://alfeker.mediafire.com/file/fmg1ss6edtdr9ae'}
          def f(pair):
            name,url=pair;out={'edition':name,'landing':url}
            try:
              s=requests.Session();s.headers['User-Agent']='Mozilla/5.0'
              r=s.get(url,timeout=45);r.raise_for_status();(p/(name+'-landing.html')).write_bytes(r.content)
              soup=BeautifulSoup(r.text,'html.parser');a=soup.select_one('a#downloadButton')
              if not a:out['links']=[{'label':a.get_text(' ',strip=True),'href':a.get('href')} for a in soup.select('a[href]')];raise ValueError('No explicit download button')
              target=urllib.parse.urljoin(r.url,a['href']);out['download']=target
              q=s.get(target,timeout=90);q.raise_for_status();assert q.content.startswith(b'%PDF'),q.headers
              (p/(name+'.pdf')).write_bytes(q.content);out.update(bytes=len(q.content),sha256=hashlib.sha256(q.content).hexdigest())
            except Exception as e:out['error']=str(e)
            print(json.dumps(out,ensure_ascii=False),flush=True);return out
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as ex:out=list(ex.map(f,sources.items()))
          (p/'manifest.json').write_text(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qawtaw6-printed-editions
          path: editions/
          retention-days: 30
