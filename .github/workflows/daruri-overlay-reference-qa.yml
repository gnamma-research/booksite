name: Daruri scholarly Unicode selection QA
on:
  workflow_dispatch:
  push:
    branches: [qa/daruri-overlay-highlight-acceptance-20261022]
    paths:
      - .github/workflows/daruri-overlay-reference-qa.yml
      - daruri/qa/audit_unicode_overlay_selection.py
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          path: qa
      - uses: actions/checkout@v4
        with:
          ref: efd9e28c8c3babac9f0fe0e21cbca1bbe85ee17b
          path: proof-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install PyMuPDF==1.26.7 fonttools==4.67.0
      - run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Build temporary scholarly Unicode candidate from exact proof
        run: |
          python proof-source/daruri/qa/experimental_original_arabic_unicode.py \
            --input proof-source/daruri/daruri.pdf \
            --map proof-source/daruri/personal-source-pango-maps/daruri.pdf.json \
            --font proof-source/daruri/build/fonts/NotoNaskhArabic-Regular.ttf \
            --output /tmp/daruri-scholarly-source-proof.pdf \
            --limit 414 --diagnostic
      - name: Test scholarly source words, copy, links, pages and all anchors
        run: |
          python qa/daruri/qa/audit_unicode_overlay_selection.py \
            --source proof-source/daruri/daruri.pdf \
            --candidate /tmp/daruri-scholarly-source-proof.pdf \
            --map proof-source/daruri/personal-source-pango-maps/daruri.pdf.json \
            --output /tmp/daruri-scholarly-selection.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scholarly-source-selection-QA-report
          path: /tmp/daruri-scholarly-selection.json
          if-no-files-found: warn
