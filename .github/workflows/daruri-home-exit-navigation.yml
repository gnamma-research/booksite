name: Daruri Home and immersive navigation QA
on:
  pull_request:
    paths:
      - 'daruri/headerless-navigation.css'
      - 'daruri/headerless-navigation.js'
      - 'daruri/index.html'
      - 'daruri/qa/verify-home-exit-browser.py'
      - '.github/workflows/daruri-home-exit-navigation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-browser-home-exit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate header script and focused QA syntax
        run: |
          node --check daruri/headerless-navigation.js
          python -m py_compile daruri/qa/verify-home-exit-browser.py
      - name: Install real Chromium and WebKit
        run: |
          python -m pip install --disable-pip-version-check playwright==1.58.0
          python -m playwright install --with-deps chromium webkit
      - name: Test Home/header/immersive exit in both browser engines
        run: python daruri/qa/verify-home-exit-browser.py
      - name: Upload desktop and mobile header screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daruri-home-navigation-visuals
          path: /tmp/daruri-nav-home-*.png
          if-no-files-found: ignore
