name: Daruri current-master text selection + context menu QA (nonrelease)
on:
  push:
    branches: [qa/daruri-current-selection-audit-20261025]
    paths:
      - 'daruri/qa/verify-current-master-selection-browser.cjs'
      - 'daruri/gnamma-word-context.js'
      - 'daruri/gnamma-word-context.css'
      - 'daruri/reading-desk.js'
      - '.github/workflows/daruri-current-selection-audit-20261025.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  selection-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source compile and selection contract
        run: |
          node --check daruri/gnamma-word-context.js
          node --check daruri/reading-desk.js
          node --check daruri/qa/verify-current-master-selection-browser.cjs
      - name: Avoid unrelated apt mirror failure
        run: |
          for file in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            [ -f "$file" ] || continue
            if grep -q 'packages.microsoft.com/ubuntu/24.04/prod' "$file"; then sudo mv "$file" "$file.disabled"; fi
          done
      - name: Install Chromium and WebKit
        run: |
          npm install --no-save --prefix daruri/qa playwright@1.56.1
          npx --prefix daruri/qa playwright install --with-deps chromium webkit
      - name: Verify text selection highlight, explicit Word Context and native Copy context menu
        run: node daruri/qa/verify-current-master-selection-browser.cjs
      - name: Save screenshots and test outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daruri-current-selection-baseline
          path: daruri/qa/selection-current-audit/
          retention-days: 14
          if-no-files-found: warn
