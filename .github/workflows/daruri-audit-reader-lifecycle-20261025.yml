name: Daruri audit reader lifecycle and route graph (nonrelease)
on:
  push:
    branches: [audit/daruri-reader-lifecycle-20261025]
    paths:
      - 'daruri/personal-export.js'
      - 'daruri/gnamma-word-context.js'
      - 'daruri/reading-desk.css'
      - 'daruri/qa/verify-copy-cross-section-browser.cjs'
      - 'daruri/qa/verify-reader-lifecycle-browser.cjs'
      - 'daruri/qa/verify-route-graph-browser.cjs'
      - '.github/workflows/daruri-audit-reader-lifecycle-20261025.yml'
  pull_request:
    branches: [integration/daruri-ux-audit-20261025]
    paths:
      - 'daruri/personal-export.js'
      - 'daruri/gnamma-word-context.js'
      - 'daruri/reading-desk.css'
      - 'daruri/qa/verify-copy-cross-section-browser.cjs'
      - 'daruri/qa/verify-reader-lifecycle-browser.cjs'
      - 'daruri/qa/verify-route-graph-browser.cjs'
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  route-and-modal-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check and source preservation
        run: |
          node --check daruri/personal-export.js
          node --check daruri/gnamma-word-context.js
          node --check daruri/qa/verify-route-graph-browser.cjs
          node --check daruri/qa/verify-reader-lifecycle-browser.cjs
          node --check daruri/qa/verify-copy-cross-section-browser.cjs
          node daruri/qa/verify-copy-links.cjs
      - name: Disable unrelated inaccessible apt repository
        run: |
          for source in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            [ -f "$source" ] || continue
            if grep -q 'packages.microsoft.com/ubuntu/24.04/prod' "$source"; then
              sudo mv "$source" "$source.disabled"
            fi
          done
      - name: Install Chromium and WebKit
        run: |
          npm install --no-save --prefix daruri/qa playwright@1.56.1
          npx --prefix daruri/qa playwright install --with-deps chromium webkit
      - name: Reproduce and test detached exporter and Continuous Word Context
        run: node daruri/qa/verify-reader-lifecycle-browser.cjs
      - name: Cross-section Copy follows visible paragraphs and protects real selections
        if: always()
        run: node daruri/qa/verify-copy-cross-section-browser.cjs
      - name: Traverse all routes including Reading Desk, Back, Forward and Visuals
        if: always()
        run: node daruri/qa/verify-route-graph-browser.cjs
      - name: Retain case-level evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daruri-reader-lifecycle-and-route-graph
          path: |
            daruri/qa/audit-lifecycle-results/
            daruri/qa/route-audit-artifacts/
            daruri/qa/copy-cross-section-results/
          retention-days: 14
          if-no-files-found: warn
