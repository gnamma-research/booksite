name: Daruri Hadith source-context integrity
on:
  push:
    branches: [master, feature/daruri-hadith-expanded-context-20261022, feature/daruri-full-english-hadith-20261023, feature/daruri-hadith-quran-note-ux-20261023]
    paths:
      - 'daruri/hadith-context-*'
      - 'daruri/hadith-anchor-data.js'
      - 'daruri/hadith-note-polish.*'
      - 'daruri/hadith-note-integration.*'
      - 'daruri/qa/verify-hadith-inline-notes.js'
      - 'daruri/qa/verify-reader-source-notes.js'
      - 'daruri/hadith-traditional-notes.js'
      - 'daruri/quran-note-headings.js'
      - 'daruri/index.html'
      - 'daruri/HADITH_CONTEXT_SOURCES.md'
      - 'daruri/source-reference-data.js'
      - 'daruri/build/build_source_reference_data.py'
      - 'daruri/sw.js'
      - 'daruri/download-bundle.js'
      - 'daruri/qa/verify-hadith-context.js'
      - '.github/workflows/daruri-hadith-context-qa.yml'
  pull_request:
    paths:
      - 'daruri/hadith-context-*'
      - 'daruri/source-reference-data.js'
      - 'daruri/build/build_source_reference_data.py'
      - 'daruri/sw.js'
      - 'daruri/download-bundle.js'
      - 'daruri/qa/verify-hadith-context.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hadith-context:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check 47 complete Arabic and full English Hadith transmissions, source notes and priority
        run: |
          npm install --no-save --no-package-lock jsdom@24
          node daruri/qa/verify-hadith-context.js
          node daruri/qa/verify-hadith-anchors.cjs
          node daruri/qa/verify-hadith-inline-notes.js
      - name: Validate generated source-reference asset
        run: python daruri/build/build_source_reference_data.py --check
      - name: Existing Quran/Hadith note router and context regressions
        run: |
          node daruri/qa/verify-reader-source-notes.js
          node daruri/qa/verify-quran-context.js
