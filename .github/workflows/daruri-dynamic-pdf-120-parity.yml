name: Gnamma all 120 dynamic apparatus PDFs - strict parity
on:
  push:
    branches: ['feature/daruri-on-demand-pdf-20261022']
    paths:
      - 'daruri/dynamic-pdf/*.py'
      - 'daruri/dynamic-pdf/*.js'
      - 'daruri/dynamic-pdf/*.cjs'
      - '.github/workflows/daruri-dynamic-pdf-120-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-packets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install pinned HTML/Arabic renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcairo2 libpango-1.0-0 libharfbuzz0b libfribidi0
          python -m pip install -q -r daruri/build/requirements.txt "PyMuPDF==1.26.7"
      - name: Generate and certify fifteen reusable apparatus PDFs
        run: python daruri/dynamic-pdf/build_packets.py
      - uses: actions/upload-artifact@v4
        with:
          name: gnamma-15-packets
          path: daruri/dynamic-pdf/packets/
          retention-days: 14
  full-matrix:
    needs: build-packets
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/download-artifact@v4
        with:
          name: gnamma-15-packets
          path: daruri/dynamic-pdf/packets/
      - name: Install PDF composition and inspection
        run: |
          python -m pip install -q "PyMuPDF==1.26.7"
          npm install --no-save --no-package-lock --prefix daruri/qa pdf-lib@1.17.1
      - name: Generate 20 approved-edition equivalents locally
        env:
          SHARDS: '6'
          SHARD: ${{ matrix.shard }}
          MATRIX: ALL
        run: node daruri/dynamic-pdf/test_assemble.cjs
      - name: Compare complete page text, pixels, bookmarks, links, destinations
        run: python daruri/dynamic-pdf/test_parity.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gnamma-120-parity-shard-${{ matrix.shard }}
          path: |
            daruri/dynamic-pdf/test-output/shard${{ matrix.shard }}/parity_results.json
            daruri/dynamic-pdf/test-output/shard${{ matrix.shard }}/results.json
          retention-days: 14
