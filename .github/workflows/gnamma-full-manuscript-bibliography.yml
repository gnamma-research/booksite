name: GNAMMA full public manuscript bibliography index
on:
  push:
    branches: [feature/integrated-source-bibliography-map-20261107]
    paths:
      - 'research/intellectual-atlas/corpora/build_manuscript_full.py'
      - '.github/workflows/gnamma-full-manuscript-bibliography.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q beautifulsoup4==4.14.2
      - name: Build complete source-linked metadata register from eight public categories
        run: python research/intellectual-atlas/corpora/build_manuscript_full.py
      - name: Validate distinct IDs, category memberships and source citations
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('research/intellectual-atlas/corpora/manuscript-full.json').read_text())
          w=d['works']; stats=d['statistics']
          assert len(w)>=3300 and len(set(x['id'] for x in w))==len(w)
          assert all(x['catalogue_url'].startswith('https://app.alreq.com/ar/AuthoredBooks/') for x in w)
          assert all(x['dating_status'].startswith('undated') for x in w)
          assert all(not x['text_acquired'] for x in w)
          assert stats['by_genre']['nahw']>=750 and stats['by_genre']['balagha']>=240
          for school in ('hanafi','maliki','shafii','hanbali'):
              assert stats['by_school'][school]['fiqh']>=150
          print('FULL REGISTER PASSED',stats)
          PY
      - name: Save full catalogue snapshot on the research branch
        if: github.ref == 'refs/heads/feature/integrated-source-bibliography-map-20261107'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/intellectual-atlas/corpora/manuscript-full.json
          if ! git diff --cached --quiet; then
            git commit -m "Research: full public manuscript bibliography with source-linked school evidence"
            git push origin HEAD:feature/integrated-source-bibliography-map-20261107
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gnamma-complete-manuscript-category-register
          path: research/intellectual-atlas/corpora/manuscript-full.json
          if-no-files-found: ignore
