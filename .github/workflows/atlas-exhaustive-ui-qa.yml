name: Gnamma Atlas exhaustive interaction audit

on:
  push:
    branches: [atlas-exhaustive-ui-audit-2026-10-30]
    paths:
      - 'research/intellectual-atlas/**'
      - '.github/workflows/atlas-exhaustive-ui-qa.yml'
  pull_request:
    branches: [master]
    paths:
      - 'research/intellectual-atlas/**'
      - '.github/workflows/atlas-exhaustive-ui-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-atlas-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Package exact revision for reproducible local reproduction
        run: |
          mkdir -p /tmp/atlas-audit-source/research /tmp/atlas-audit-source/assets
          cp -a research/intellectual-atlas /tmp/atlas-audit-source/research/
          cp -a assets/gnamma-mark.svg /tmp/atlas-audit-source/assets/
          (cd /tmp/atlas-audit-source && zip -qr /tmp/atlas-audit-source-bundle.zip research/intellectual-atlas assets/gnamma-mark.svg)
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-exact-source-for-ui-audit
          path: /tmp/atlas-audit-source-bundle.zip
          retention-days: 7
      - name: Install cross-browser harness
        run: |
          python -m pip install -q playwright==1.58.0
          python -m playwright install --with-deps chromium webkit
      - name: Run exhaustive UI interaction matrix
        shell: bash
        run: |
          python -m http.server 8123 --bind 127.0.0.1 >/tmp/atlas-exhaustive-server.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          for i in {1..90}; do
            if curl --silent --fail http://127.0.0.1:8123/research/intellectual-atlas/ > /dev/null; then break; fi
            sleep .2
          done
          python research/intellectual-atlas/tests/verify_exhaustive_ui.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-exhaustive-ui-evidence
          path: |
            /tmp/gnamma-atlas-ui-audit/**
            /tmp/atlas-exhaustive-server.log
          if-no-files-found: ignore
