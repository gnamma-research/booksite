name: Daruri reusable apparatus print-design template proofs
on:
  push:
    branches: [feature/daruri-design-aware-generated-editions-20261022]
    paths:
      - 'daruri/dynamic-pdf/design-styles.json'
      - 'daruri/dynamic-pdf/render_design_packets.py'
      - 'daruri/build/build_apparatus_variants.py'
      - '.github/workflows/daruri-print-design-templates-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  templates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source-compatible WeasyPrint and Arabic typography libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcairo2 libpango-1.0-0 libharfbuzz0b libfribidi0
          python -m pip install -q -r daruri/build/requirements.txt 'PyMuPDF==1.26.7'
      - name: Compile lint
        run: python -m py_compile daruri/dynamic-pdf/render_design_packets.py daruri/build/build_apparatus_variants.py
      - name: Prove approved A4 packet pages, glyph geometry and links retain their exact design
        run: |
          python daruri/dynamic-pdf/render_design_packets.py \
            --style gnamma-a4-v1 --components glossary --output-dir /tmp/daruri-style-test
          python - <<'PY'
          import hashlib,json,pathlib,fitz
          d=pathlib.Path('/tmp/daruri-style-test')
          left=d/'gnamma-a4-v1-apparatus-glossary.pdf'
          right=pathlib.Path('daruri/dynamic-pdf/packets/gnamma-apparatus-glossary.pdf')
          manifest=json.loads(pathlib.Path('daruri/dynamic-pdf/packets/manifest.json').read_text())
          row=next(p for p in manifest['packets'] if p['components']==['glossary'])
          assert hashlib.sha256(right.read_bytes()).hexdigest()==row['sha256']
          with fitz.open(left) as generated,fitz.open(right) as approved:
            assert len(generated)==len(approved)==row['pages']
            for a,b in zip(generated,approved):
              assert a.rect==b.rect
              assert a.get_pixmap().samples==b.get_pixmap().samples,'Original design raster changed'
              wa=[(w[4],*[round(c,3) for c in w[:4]]) for w in a.get_text('words')]
              wb=[(w[4],*[round(c,3) for c in w[:4]]) for w in b.get_text('words')]
              assert wa==wb,'Original typography or selectable word positions changed'
              assert a.get_links()==b.get_links(),'Original apparatus hyperlink changed'
          print('A4_CANONICAL_PACKET_PIXEL_AND_WORD_EXACT',len(generated) if False else row['pages'],
            hashlib.sha256(left.read_bytes()).hexdigest(),row['sha256'])
          PY
      - name: Typeset real A5 compact and US Letter apparatus in separate templates
        run: |
          python daruri/dynamic-pdf/render_design_packets.py \
            --style gnamma-a5-compact-v1 --components glossary index \
            --preview --output-dir /tmp/daruri-style-test
          python daruri/dynamic-pdf/render_design_packets.py \
            --style gnamma-letter-spacious-v1 --components glossary index applications \
            --preview --output-dir /tmp/daruri-style-test
          python - <<'PY'
          import pathlib,json,fitz
          d=pathlib.Path('/tmp/daruri-style-test')
          for file in sorted(d.glob('*PREVIEW-NONRELEASE.pdf')):
            m=json.loads(pathlib.Path(str(file)+'.json').read_text())
            assert m['not_a_released_pdf'] and not m['exact_source_link_map_approved']
            with fitz.open(file) as pdf:
              assert pdf.page_count==m['pages'] and pdf.page_count>0
              out=d/(file.stem+'-first-page.png')
              pdf[0].get_pixmap(matrix=fitz.Matrix(1.5,1.5)).save(out)
              print('STYLE_PROOF',file.name,m['paper'],pdf.page_count,tuple(pdf[0].rect))
          PY
      - name: Refuse to publish the A5 template before its own source design and links are certified
        run: |
          if python daruri/dynamic-pdf/render_design_packets.py \
            --style gnamma-a5-compact-v1 --components glossary \
            --output-dir /tmp/daruri-style-test; then
            echo 'FAIL: unapproved A5 template silently published'; exit 1
          fi
          echo 'PASS: style-only output cannot be published'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daruri-design-template-proof-not-approved
          path: /tmp/daruri-style-test/
          retention-days: 10
          if-no-files-found: warn
