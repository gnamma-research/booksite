name: Daruri EXPERIMENT 5-profile original Arabic search
on:
  workflow_dispatch:
  pull_request:
    branches:
      - feature/daruri-arabic-pango-pilot-20261022
    paths:
      - daruri/qa/experimental_original_arabic_unicode.py
      - daruri/qa/experimental_original_arabic_coverage.py
      - .github/workflows/daruri-experimental-source-matrix.yml
permissions:
  contents: read
jobs:
  five-profile-search-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: reading-arabic
            src: daruri/editions/reading/daruri-reading-arabic-titles-off.pdf
            map: daruri/editions/maps/daruri-reading-arabic-titles-off.pdf.json
            diagnostic: ''
          - id: reading-arabic-vowelled
            src: daruri/editions/reading/daruri-reading-arabic-vowelled-titles-off.pdf
            map: daruri/editions/maps/daruri-reading-arabic-vowelled-titles-off.pdf.json
            diagnostic: '--diagnostic'
          - id: reading-bilingual-vowelled
            src: daruri/editions/reading/daruri-reading-bilingual-titles-off.pdf
            map: daruri/editions/maps/daruri-reading-bilingual-titles-off.pdf.json
            diagnostic: '--diagnostic'
          - id: study-bilingual
            src: daruri/editions/study/daruri-study-bilingual-titles-off.pdf
            map: daruri/editions/maps/daruri-study-bilingual-titles-off.pdf.json
            diagnostic: '--diagnostic'
          - id: scholarly-reference
            src: daruri/daruri.pdf
            map: daruri/personal-source-pango-maps/daruri.pdf.json
            diagnostic: '--diagnostic'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install independent extraction engines
        run: |
          python -m pip install "PyMuPDF==1.26.7" "fonttools>=4.55,<5"
          sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Build TEMPORARY semantic text layer (not a published PDF)
        env:
          SOURCE: ${{ matrix.src }}
          MAPPING: ${{ matrix.map }}
          PROFILE: ${{ matrix.id }}
          DIAGNOSTIC: ${{ matrix.diagnostic }}
        run: |
          python daruri/qa/experimental_original_arabic_unicode.py \
            --input "$SOURCE" --map "$MAPPING" \
            --font daruri/build/fonts/NotoNaskhArabic-Regular.ttf \
            --output "/tmp/$PROFILE-unicode-PROTOTYPE.pdf" \
            --limit 414 --report "/tmp/$PROFILE-structure.json" $DIAGNOSTIC
      - name: Independent four-way baseline vs candidate phrase extraction
        env:
          SOURCE: ${{ matrix.src }}
          MAPPING: ${{ matrix.map }}
          PROFILE: ${{ matrix.id }}
        run: |
          python daruri/qa/experimental_original_arabic_coverage.py \
            --original "$SOURCE" \
            --candidate "/tmp/$PROFILE-unicode-PROTOTYPE.pdf" \
            --map "$MAPPING" \
            --report "/tmp/$PROFILE-coverage.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daruri-source-unicode-${{ matrix.id }}-diagnostics
          path: |
            /tmp/${{ matrix.id }}-structure.json
            /tmp/${{ matrix.id }}-coverage.json
          retention-days: 7
