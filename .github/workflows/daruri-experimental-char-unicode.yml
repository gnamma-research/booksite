name: Daruri isolated source-char Unicode CI (NOT RELEASE)
on:
  push:
    branches: [experiment/daruri-actualtext-source-20261022]
    paths:
      - 'daruri/qa/experimental_original_char_unicode.py'
      - 'daruri/qa/verify_original_char_unicode.py'
      - '.github/workflows/daruri-experimental-char-unicode.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check PyMuPDF==1.26.7
      - run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Build temporary CHAR-LEVEL Unicode repair for original 36-page PDF
        run: |
          python daruri/qa/experimental_original_char_unicode.py \
            --input daruri/editions/reading/daruri-reading-arabic-titles-off.pdf \
            --map daruri/editions/maps/daruri-reading-arabic-titles-off.pdf.json \
            --output /tmp/daruri-char-unicode-proof-NOT-RELEASE.pdf
      - name: Preserve diagnostic proof and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daruri-char-unicode-proof-NOT-RELEASE
          path: /tmp/daruri-char-unicode-proof-NOT-RELEASE.pdf
          retention-days: 7
          if-no-files-found: warn
