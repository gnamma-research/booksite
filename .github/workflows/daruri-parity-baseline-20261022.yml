name: Daruri nonpublishing QA baseline evidence
on:
  push:
    branches:
      - qa/daruri-pdf-parity-20261022
    paths:
      - .github/workflows/daruri-parity-baseline-20261022.yml
      - daruri/qa/verify_native_arabic_pdf_extractability.py
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Hash approved original PDFs (read only)
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            daruri/editions/apparatus/daruri-reading-bilingual-glossary.pdf \
            daruri/editions/apparatus/daruri-reading-english-index-concordance.pdf \
            daruri/editions/apparatus/daruri-study-bilingual-glossary-index-concordance-applications-titles-on.pdf \
            daruri/editions/reading/daruri-reading-bilingual-titles-off.pdf \
            daruri/editions/study/daruri-study-bilingual-titles-on.pdf \
            daruri/daruri.pdf \
            daruri/daruri-arabic.pdf \
            daruri/daruri-arabic-vowelled.pdf > daruri-baseline-sha256.txt
          cat daruri-baseline-sha256.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install native PDF extraction library
        run: python -m pip install 'PyMuPDF==1.26.7'
      - name: Measure Arabic and English native Unicode text coverage
        run: python daruri/qa/verify_native_arabic_pdf_extractability.py --json-out daruri-native-search-qa.json
      - name: Upload certified original PDFs solely for offline comparison
        uses: actions/upload-artifact@v4
        with:
          name: daruri-certified-parity-baselines
          retention-days: 7
          path: |
            daruri-baseline-sha256.txt
            daruri-native-search-qa.json
            daruri/editions/apparatus/daruri-reading-bilingual-glossary.pdf
            daruri/editions/apparatus/daruri-reading-english-index-concordance.pdf
            daruri/editions/apparatus/daruri-study-bilingual-glossary-index-concordance-applications-titles-on.pdf
            daruri/editions/reading/daruri-reading-bilingual-titles-off.pdf
            daruri/editions/study/daruri-study-bilingual-titles-on.pdf
            daruri/daruri.pdf
            daruri/daruri-arabic.pdf
            daruri/daruri-arabic-vowelled.pdf
            daruri/edition-r3-20261020.js
            daruri/pdf-editions-manifest.json
