name: Tamhid complete draft snapshot
on:
  push:
    branches: [master]
    paths: ['.github/workflows/tamhid-complete-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            texts/al-turka/qawaid-al-tawhid/
            texts/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: tamhid-complete-draft-snapshot
          path: texts/
          retention-days: 3
