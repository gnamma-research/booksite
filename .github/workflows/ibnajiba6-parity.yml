name: Ibn Ajiba Daruri interface QA
on:
  push:
    branches: [codex/ibnajiba6-daruri-parity]
  pull_request:
    paths:
      - 'texts/ibn-ajiba/al-bahr-al-madid/**'
      - 'tests/ibn-ajiba/**'
      - '.github/workflows/ibnajiba6-parity.yml'
permissions:
  contents: write
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BAHR_DIR: texts/ibn-ajiba/al-bahr-al-madid
      BAHR_URL: http://127.0.0.1:8766/
      BAHR_QA_OUTPUT: qa-artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 tests/ibn-ajiba/package_reader.py
      - run: node --test tests/ibn-ajiba/reader-core.cjs
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium webkit
      - name: Browser verification
        run: |
          python3 -m http.server 8766 --bind 127.0.0.1 --directory "$BAHR_DIR" > /tmp/bahr-server.log 2>&1 &
          node tests/ibn-ajiba/reader-browser.cjs
      - name: Save verified offline package
        if: github.event_name == 'push'
        run: |
          git add "$BAHR_DIR/offline-reader.zip" "$BAHR_DIR/offline-files.json"
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Refresh verified Ibn Ajiba offline reader"
            git push origin HEAD:codex/ibnajiba6-daruri-parity
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ibn-ajiba-parity-qa
          path: qa-artifacts/
