name: Rebuild Daruri precision maps after Qur'an citation audit
on:
  push:
    branches: [fix/daruri-quran-allusion-audit-20261021]
    paths:
      - '.github/workflows/daruri-source-policy-anchor-maps.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daruri-qpolicy-anchor-maps
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies for exact verified font-layout coordinates
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libgdk-pixbuf-2.0-0
          python -m pip install -r daruri/build/requirements.txt 'PyMuPDF==1.26.7'
      - name: Verify five published PDFs and all 259 section anchors
        run: python daruri/qa/verify_pdf_export_maps.py
      - name: Rebuild all five checksum-bound precise word maps
        run: python -u daruri/build/build_personal_anchor_maps.py --publish
      - name: Require exact hash match and >99% verified word-map coverage
        run: |
          node daruri/qa/verify-personal-pdf-upgrade.cjs
          node daruri/qa/verify-personal-export-safety.js
      - name: Commit only refreshed personal anchor maps on isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daruri/personal-anchor-maps/*.json
          if git diff --cached --quiet; then
            echo "All five precision maps already current."
            exit 0
          fi
          git commit -m "Synchronize five precise personal-PDF maps with citation-cleaned PDFs [skip ci]"
          for n in 1 2 3; do
            git fetch origin fix/daruri-quran-allusion-audit-20261021
            if git rebase origin/fix/daruri-quran-allusion-audit-20261021 && git push origin HEAD:fix/daruri-quran-allusion-audit-20261021; then
              exit 0
            fi
            sleep 5
          done
          echo "Conflicting concurrent changes: do not force push maps" >&2
          exit 1
