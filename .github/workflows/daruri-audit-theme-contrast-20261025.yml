name: Daruri palette contrast diagnostic (nonrelease)
on:
  push:
    branches: [audit/daruri-reader-lifecycle-20261025]
    paths:
      - 'daruri/compact-menu.css'
      - '.github/workflows/daruri-audit-theme-contrast-20261025.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  contrast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Disable unrelated unavailable apt source
        run: |
          for source in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            [ -f "$source" ] || continue
            if grep -q 'packages.microsoft.com/ubuntu/24.04/prod' "$source"; then sudo mv "$source" "$source.disabled"; fi
          done
      - name: Install local test browsers
        run: |
          npm install --no-save --prefix daruri/qa playwright@1.56.1 @axe-core/playwright@4.10.2
          npx --prefix daruri/qa playwright install --with-deps chromium webkit
      - name: Check 36 actual palette combinations and 12 missing-font conditions
        run: node daruri/qa/verify-theme-accessibility-and-fonts.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daruri-palette-contrast-evidence
          path: daruri/qa/audit-artifacts/
          retention-days: 14
          if-no-files-found: warn
