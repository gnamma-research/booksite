name: Daruri unified search QA
on:
  push:
    paths:
      - '.github/workflows/daruri-unified-search-qa.yml'
      - 'daruri/index.html'
      - 'daruri/sw.js'
      - 'daruri/gnamma-search.js'
      - 'daruri/gnamma-morphology.js'
      - 'daruri/gnamma-word-context.js'
      - 'daruri/gnamma-word-context.css'
      - 'daruri/morph-lexicon.json'
      - 'daruri/morph-daruri-v1.json'
      - 'daruri/morph-mustasfa-v1.json'
      - 'daruri/build/build_gnamma_morph_index.py'
      - 'daruri/build/export_morph_review.py'
      - 'daruri/qa/verify-morphology.cjs'
      - 'daruri/qa/verify-context-index.cjs'
      - 'daruri/qa/test-morphology-build.py'
      - 'daruri/build/evaluate_morph_review.py'
      - 'daruri/build/pack_morph_context.py'
      - 'daruri/build/propose_dictionary_morphology.py'
      - 'daruri/qa/test-dictionary-morphology.py'
      - 'daruri/build/apply_morph_reviews.py'
      - 'daruri/build/enrich_morph_roots.py'
      - 'daruri/build/export_morph_review.py'
      - 'daruri/gnamma-scholarly.js'
      - 'daruri/gnamma-scholarly.css'
      - 'daruri/qa/verify-scholarly-patterns.cjs'
      - 'daruri/gnamma-proximity.js'
      - 'daruri/gnamma-search-return.js'
      - 'daruri/dictionary.html'
      - 'texts/al-ghazali/al-mustasfa/index.html'
      - 'daruri/qa/verify-search-return.cjs'
      - 'daruri/qa/verify-proximity.cjs'
      - 'daruri/gnamma-search.css'
      - 'daruri/qa/verify-unified-search.cjs'
      - 'daruri/build/build_gnamma_search_index.py'
      - 'daruri/edition-r3-20261020.js'
      - 'daruri/dictionary-r3-20261020.js'
      - 'texts/al-ghazali/al-mustasfa/assets/data.js'
      - 'texts/al-ghazali/al-mustasfa/data/gnamma-search-index.json'
      - 'arabic/full-arabic-pages.json'
  pull_request:
    paths:
      - 'daruri/index.html'
      - 'daruri/gnamma-search.js'
      - 'daruri/gnamma-morphology.js'
      - 'daruri/gnamma-word-context.js'
      - 'daruri/gnamma-word-context.css'
      - 'daruri/morph-lexicon.json'
      - 'daruri/morph-daruri-v1.json'
      - 'daruri/morph-mustasfa-v1.json'
      - 'daruri/build/build_gnamma_morph_index.py'
      - 'daruri/build/export_morph_review.py'
      - 'daruri/qa/verify-morphology.cjs'
      - 'daruri/qa/verify-context-index.cjs'
      - 'daruri/qa/test-morphology-build.py'
      - 'daruri/build/evaluate_morph_review.py'
      - 'daruri/build/pack_morph_context.py'
      - 'daruri/build/propose_dictionary_morphology.py'
      - 'daruri/qa/test-dictionary-morphology.py'
      - 'daruri/build/apply_morph_reviews.py'
      - 'daruri/build/enrich_morph_roots.py'
      - 'daruri/build/export_morph_review.py'
      - 'daruri/gnamma-scholarly.js'
      - 'daruri/gnamma-scholarly.css'
      - 'daruri/qa/verify-scholarly-patterns.cjs'
      - 'daruri/gnamma-proximity.js'
      - 'daruri/gnamma-search-return.js'
      - 'daruri/dictionary.html'
      - 'texts/al-ghazali/al-mustasfa/index.html'
      - 'daruri/qa/verify-search-return.cjs'
      - 'daruri/qa/verify-proximity.cjs'
      - 'daruri/gnamma-search.css'
      - 'daruri/qa/verify-unified-search.cjs'
      - 'texts/al-ghazali/al-mustasfa/data/gnamma-search-index.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unified-search-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify reproducible al-Mustasfa search index
        run: |
          python3 daruri/build/build_gnamma_search_index.py
          git diff --exit-code -- texts/al-ghazali/al-mustasfa/data/gnamma-search-index.json
      - name: Install browser test runner
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Static script syntax checks
        run: |
          node --check daruri/gnamma-morphology.js
          node --check daruri/gnamma-word-context.js
          node --check daruri/gnamma-search.js
          python3 -m py_compile daruri/build/build_gnamma_morph_index.py
          python3 -m py_compile daruri/build/export_morph_review.py
          python3 -m py_compile daruri/build/evaluate_morph_review.py
          python3 -m py_compile daruri/build/pack_morph_context.py
          python3 -m py_compile daruri/build/propose_dictionary_morphology.py
          python3 daruri/qa/test-dictionary-morphology.py
          python3 -m py_compile daruri/build/apply_morph_reviews.py
          python3 -m py_compile daruri/build/enrich_morph_roots.py
          python3 daruri/qa/test-morphology-build.py
      - name: Run Daruri browser search tests
        run: |
          node daruri/qa/verify-unified-search.cjs
          node daruri/qa/verify-search-return.cjs
          node daruri/qa/verify-proximity.cjs
          node daruri/qa/verify-scholarly-patterns.cjs
          node daruri/qa/verify-morphology.cjs
          node daruri/qa/verify-context-index.cjs
