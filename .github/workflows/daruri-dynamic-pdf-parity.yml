name: Gnamma dynamic apparatus PDF proof of equivalence
on:
  push:
    branches: ['feature/daruri-on-demand-pdf-20261022']
    paths: ['daruri/dynamic-pdf/**','.github/workflows/daruri-dynamic-pdf-parity.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: gnamma-dynamic-pdf-parity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install canonical Arabic publication stack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcairo2 libpango-1.0-0 libharfbuzz0b libfribidi0
          python -m pip install -q -r daruri/build/requirements.txt "PyMuPDF==1.26.7"
          npm install --no-save --no-package-lock --prefix daruri/qa pdf-lib@1.17.1
      - name: Build 15 reproducible HTML/CSS apparatus packets
        run: python daruri/dynamic-pdf/build_packets.py
      - name: Assemble real approved base and apparatus PDFs with browser-compatible code
        run: node daruri/dynamic-pdf/test_assemble.cjs
      - name: Strict 3-profile visual/content/navigation equivalence
        run: python daruri/dynamic-pdf/test_parity.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gnamma-dynamic-pdf-proof
          path: |
            daruri/dynamic-pdf/packets/**
            daruri/dynamic-pdf/test-output/**
          retention-days: 7
