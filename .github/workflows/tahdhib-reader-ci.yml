name: Tahdhib actual reader and logic verification
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/tahdhib-reader-ci.yml"
      - "tools/tahdhib/reader_qa.mjs"
      - "tools/tahdhib/verify_logic_core.py"
      - "texts/al-taftazani/tahdhib-al-kalam/edition/**"
      - "texts/al-taftazani/tahdhib-al-mantiq/edition/**"
permissions:
  contents: read
jobs:
  logical-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check non-modal inference reconstructions and source-corpus integrity
        run: |
          python tools/tahdhib/verify_logic_core.py
          python - <<'PY'
          import json, pathlib
          base=pathlib.Path('texts/al-taftazani')
          def load(name):
              data=(base/name/'edition/data.js').read_text(encoding='utf-8')
              return json.loads(data.split('=',1)[1].rstrip(';\n '))
          logic=load('tahdhib-al-mantiq');kalam=load('tahdhib-al-kalam')
          assert len(logic['units'])==19 and len(kalam['units'])==1044
          assert len({u['id'] for u in kalam['units']})==1044
          assert len({u['page'] for u in kalam['units']})==113
          assert len(logic['open_issues'])>=6 and len(kalam['open_issues'])==3
          text={u['id']:u['ar'] for u in logic['units']}
          assert 'الوقتيتان المطلقتان' in text['L.11']
          assert 'وإلا لزم سلب الشيء عن نفسه' in text['L.14']
          assert 'مع الموجبة الموجبتين، ومع السالبة السالبتين' in text['L.16']
          assert 'مع الموجبة الكلية الموجبتين' not in text['L.16']
          assert 'التناقض اختلاف قضيتين' in text['L.13']
          assert 'في الكيف والكم والجهة' in text['L.13']
          assert kalam['pending_pages']==[77,100,124]
          ktext={u['id']:u['ar'] for u in kalam['units']}
          assert 'مقدار طبيعة غير قارة' in ktext['KAL-039.03']
          assert 'ولامتناع فنائه لما مر' in ktext['KAL-039.04']
          assert 'مقدار أسرعها' in ktext['KAL-039.05']
          assert 'فمنها القدرة لاستناد الحوادث إليه تعالى وفاقا' in ktext['KAL-080.11']
          assert 'و«وهم راكعون» للعطف' in ktext['KAL-124.06']
          assert len(logic['stage78_source_concordance']['unit_printed_pages'])==19
          assert len(logic.get('witness_comparisons_stage77',[]))>=9
          assert 'والنظريات' in text['L.18']
          assert 'وكل منها عنادية إن كان التنافي لذات الجزأين' in text['L.12']
          assert 'وكل منهما عنادية' not in text['L.12']
          assert 'لزومية إن كان ذلك لعلاقة' in text['L.12']
          assert 'بتنافي نسبتين' in text['L.12'] and 'بتنافي النسبتين' not in text['L.12']
          assert 'صدقاً وكذباً معاً' not in text['L.12']
          assert 'على جميع التقادير للمقدم' in text['L.12']
          assert 'أو لبعضها مطلقاً جزئية' in text['L.12']
          assert 'والنقيض للضرورية الممكنة العامة' in text['L.13']
          assert 'في العكس المستوي' in text['L.15']
          assert 'وبين انعكاس الخاصتين' in text['L.15']
          assert 'بالافتراض' not in text['L.15']
          assert 'فتأمل' not in text['L.15']
          assert 'وقد بين انعكاس الخاصتين' not in text['L.15']
          assert 'وجود الموضوع محققاً وهي الخارجية' in text['L.10']
          assert 'وجود الموضوع إما محققاً' not in text['L.10']
          assert 'فيسمى معدولاً' in text['L.11']
          assert 'وإلا فمحصلة' not in text['L.11']
          assert 'وإلا فمطلقة' not in text['L.11']
          assert 'فإن كان الحكم في القضية' in text['L.11']
          assert 'ما دام ذات الموضوع موجودة' not in text['L.11']
          assert 'فالمطلقة العامة' in text['L.11']
          assert 'لعدم ضرورة خلافها فالممكنة العامة' in text['L.11']
          assert 'باللاضرورة الذاتية' in text['L.11']
          assert 'الوقتيتان المطلقتان' in text['L.11']
          assert 'وتسمى الوجودية اللادائمة' in text['L.11']
          assert 'بلا ضرورة الجانب الموافق أيضاً وتسمى الممكنة الخاصة' in text['L.11']
          assert 'باللاضرورة من الجانب الموافق' not in text['L.11']
          assert 'وللدائمة المطلقة العامة' in text['L.13']
          assert 'والله أعلم بالصواب' in text['L.19']
          print('PASS: Cairo L16 witness kept separate from longer commentary-contained print and 19 / 1,044 corpus integrity')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tahdhib-nonmodal-proof-report
          path: tools/tahdhib/verified_nonmodal_results.json

  reader-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless Chromium test dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Exercise both bilingual readers in desktop, portrait, and landscape
        run: |
          python3 -m http.server 8765 >/tmp/tahdhib-http.log 2>&1 &
          SERVER=$!
          trap 'kill "$SERVER" || true' EXIT
          sleep 2
          node tools/tahdhib/reader_qa.mjs
