name: Daruri Editions QA
on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/daruri-editions-qa.yml"
      - "daruri/editions.js"
      - "daruri/editions-icons.js"
      - "daruri/editions-icons.css"
      - "daruri/editions-selector.js"
      - "daruri/editions-selector.css"
      - "daruri/qa/verify-published-selector.cjs"
      - "daruri/qa/verify-published-selector-browser.mjs"
      - "daruri/qa/verify-editions-icons.cjs"
      - "daruri/qa/verify-editions-icons-browser.mjs"
      - "daruri/qa/verify-unvowelled-layout.py"
  push:
    branches: [master]
    paths:
      - ".github/workflows/daruri-editions-qa.yml"
      - "daruri/editions/**"
      - "daruri/build/print_editions.py"
      - "daruri/build/publish_editions.py"
      - "daruri/build/publish_unvowelled_reading.py"
      - "daruri/download-bundle.js"
      - "daruri/editions.js"
      - "daruri/editions-icons.js"
      - "daruri/editions-icons.css"
      - "daruri/editions-selector.js"
      - "daruri/editions-selector.css"
      - "daruri/qa/verify-published-selector.cjs"
      - "daruri/qa/verify-published-selector-browser.mjs"
      - "daruri/editions.css"
      - "daruri/index.html"
      - "daruri/sw.js"
      - "daruri/qa/verify-ready-editions.js"
      - "daruri/qa/verify-editions-icons.cjs"
      - "daruri/qa/verify-editions-icons-browser.mjs"
      - "daruri/qa/verify-unvowelled-layout.py"
      - "daruri/qa/verify-editions-configurator.js"
jobs:
  qa:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: JavaScript syntax
        run: |
          node --check daruri/editions.js
          node --check daruri/editions-icons.js
          node --check daruri/editions-selector.js
          node --check daruri/qa/verify-published-selector.cjs
          node --check daruri/qa/verify-published-selector-browser.mjs
          node --check daruri/qa/verify-editions-icons.cjs
          node --check daruri/qa/verify-ready-editions.js
      - name: Source and edition downloads
        run: |
          node daruri/qa/verify-editions-configurator.js
          node daruri/qa/verify-ready-editions.js
          node daruri/qa/verify-editions-icons.cjs
          node daruri/qa/verify-published-selector.cjs

      - name: Browser interaction and mobile rendering
        shell: bash
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          python3 -m http.server 8123 --bind 127.0.0.1 > /tmp/daruri-editions-http.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          for i in {1..40}; do
            if curl --silent --fail http://127.0.0.1:8123/daruri/ > /dev/null; then break; fi
            sleep 0.25
          done
          node daruri/qa/verify-published-selector-browser.mjs
      - name: Verify A4 PDFs and render sample pages
        run: |
          python -m pip install --disable-pip-version-check "PyMuPDF>=1.26,<1.28"
          python daruri/qa/verify-unvowelled-layout.py
      - name: Upload desktop and mobile visual proofs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daruri-editions-desktop-mobile
          path: test-artifacts/*.png
          if-no-files-found: ignore
