name: Daruri Editions QA
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/daruri-editions-qa.yml"
      - "daruri/editions/**"
      - "daruri/editions.js"
      - "daruri/editions.css"
      - "daruri/index.html"
      - "daruri/sw.js"
      - "daruri/qa/verify-ready-editions.js"
      - "daruri/qa/verify-editions-configurator.js"
jobs:
  qa:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: |
          node --check daruri/editions.js
          node --check daruri/qa/verify-ready-editions.js
      - name: Source and edition downloads
        run: |
          node daruri/qa/verify-editions-configurator.js
          node daruri/qa/verify-ready-editions.js
