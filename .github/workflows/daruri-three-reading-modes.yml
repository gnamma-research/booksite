name: Daruri three reading modes and dock QA
on:
  push:
    branches: [master, feature/daruri-three-reading-modes-20261022]
    paths:
      - 'daruri/index.html'
      - 'daruri/reading-mode-controls.js'
      - 'daruri/reading-mode-controls.css'
      - 'daruri/reading-navigation-*.js'
      - 'daruri/reading-navigation-*.css'
      - 'daruri/qa/verify-reading-navigation-*'
      - 'daruri/qa/verify-compact-menus.js'
      - 'daruri/qa/verify-reading-desk-redesign.js'
      - 'daruri/reading-desk.js'
      - 'daruri/qa/verify-three-reading-modes.cjs'
      - 'daruri/qa/verify-focus-modes.js'
      - '.github/workflows/daruri-three-reading-modes.yml'
  pull_request:
    paths:
      - 'daruri/index.html'
      - 'daruri/reading-mode-controls.js'
      - 'daruri/reading-mode-controls.css'
      - 'daruri/reading-navigation-*.js'
      - 'daruri/reading-navigation-*.css'
      - 'daruri/qa/verify-reading-navigation-*'
      - 'daruri/qa/verify-compact-menus.js'
      - 'daruri/qa/verify-reading-desk-redesign.js'
      - 'daruri/reading-desk.js'
      - 'daruri/qa/verify-three-reading-modes.cjs'
      - '.github/workflows/daruri-three-reading-modes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focus-and-dock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install source test DOM helper
        run: npm install --no-save --prefix daruri/qa jsdom@26
      - name: Source and preservation checks
        env:
          NODE_PATH: daruri/qa/node_modules
        run: |
          node --check daruri/reading-mode-controls.js
          node --check daruri/reading-desk.js
          node daruri/qa/verify-focus-modes.js
          node daruri/qa/verify-reader-structure.js
          node daruri/qa/verify-reading-desk-redesign.js
          node daruri/qa/verify-reading-navigation-history.js
          node daruri/qa/verify-compact-menus.js
          node daruri/qa/verify-contents-structure.js
      - name: Exclude unavailable unrelated Microsoft apt source
        run: |
          # GitHub Ubuntu runners can include a Microsoft feed that returns
          # HTTP 403. Playwright's signed Ubuntu dependencies do not use it.
          for source in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            [ -f "$source" ] || continue
            if grep -q 'packages.microsoft.com/ubuntu/24.04/prod' "$source"; then
              echo "Disabling inaccessible third-party apt source: $source"
              sudo mv "$source" "$source.disabled"
            fi
          done
      - name: Install browser smoke test
        run: |
          npm install --no-save --prefix daruri/qa playwright@1.56.1
          npx --prefix daruri/qa playwright install --with-deps chromium webkit
      - name: Test mobile Chromium and WebKit reader
        run: |
          node daruri/qa/verify-three-reading-modes.cjs
          node daruri/qa/verify-reading-navigation-browser.cjs