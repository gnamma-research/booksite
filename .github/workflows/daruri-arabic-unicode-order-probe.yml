name: Daruri Arabic Unicode/order experiment (NON-RELEASE)
on:
  push:
    branches: [qa/daruri-arabic-unicode-order-20261022]
    paths:
      - 'daruri/qa/diagnose_arabic_pdf_unicode.py'
      - 'daruri/qa/audit_arabic_native_414.py'
      - '.github/workflows/daruri-arabic-unicode-order-probe.yml'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: daruri-arabic-unicode-experiment
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Arabic comparison fonts and Poppler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-core fonts-hosny-amiri poppler-utils
      - name: Install pinned PDF diagnostics
        run: python -m pip install WeasyPrint==68.0 PyMuPDF==1.26.7 'fonttools>=4.59'
      - name: Show environment
        run: |
          fc-match 'Noto Naskh Arabic'
          fc-match 'Amiri'
          python -c 'import weasyprint,fitz; print("weasyprint",weasyprint.__version__,"pymupdf",fitz.VersionBind)'
      - name: Diagnose deployed source-PDF CMaps, RTL extraction order and fonts
        run: |
          python daruri/qa/diagnose_arabic_pdf_unicode.py --output-dir /tmp/daruri-unicode-order-probe
      - name: Full 414-passage native Arabic search matrix (four canonical plus A4)
        run: |
          python daruri/qa/audit_arabic_native_414.py --output /tmp/daruri-unicode-order-probe/414-matrix.json
      - name: Save non-release evidence (sample fixture PDFs and JSON)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daruri-arabic-unicode-order-NON-RELEASE
          path: |
            /tmp/daruri-unicode-order-probe/report.json
            /tmp/daruri-unicode-order-probe/414-matrix.json
            /tmp/daruri-unicode-order-probe/probe-*.pdf
          if-no-files-found: warn
