name: Daruri semantic-first native PDFKit source-note repair experiment
on:
  push:
    branches: [qa/daruri-vowelled-pdfkit-ab-20261022]
    paths:
      - '.github/workflows/daruri-semantic-first-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-pdfkit:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check PyMuPDF==1.26.7
      - name: Generate SHA-bound scholarly source semantic layer before original glyphs
        run: |
          python daruri/qa/experimental_original_char_unicode.py \
            --input daruri/daruri.pdf \
            --map daruri/personal-source-pango-maps/daruri.pdf.json \
            --output /tmp/scholarly-semantic-first.pdf \
            --scalar-harakat --scalar-mark-fraction 0.30 \
            --all-source-runs --semantic-first
      - name: Certify all original vowels/414 source searches, geometry, clean PDFKit clipboard
        run: |
          swift daruri/qa/verify_char_unicode_pdfkit.swift \
            /tmp/scholarly-semantic-first.pdf \
            daruri/personal-source-pango-maps/daruri.pdf.json
  native-mupdf:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check PyMuPDF==1.26.7
      - run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Build temporary source and measure unchanged pixels, links and copy semantics
        run: |
          python daruri/qa/experimental_original_char_unicode.py \
            --input daruri/daruri.pdf \
            --map daruri/personal-source-pango-maps/daruri.pdf.json \
            --output /tmp/scholarly-semantic-first.pdf \
            --scalar-harakat --scalar-mark-fraction 0.30 \
            --all-source-runs --semantic-first
          python daruri/qa/verify_char_unicode_profiles.py \
            --source daruri/daruri.pdf \
            --candidate /tmp/scholarly-semantic-first.pdf \
            --map daruri/personal-source-pango-maps/daruri.pdf.json \
            --report /tmp/scholarly-semantic-first.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-first-scholarly-native-QA
          path: /tmp/scholarly-semantic-first.json
          retention-days: 12
          if-no-files-found: warn
