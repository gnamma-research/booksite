name: Daruri full Arabic native search gate (READ-ONLY)
on:
  push:
    branches: [qa/daruri-arabic-unicode-order-20261022]
    paths:
      - '.github/workflows/daruri-native-414-fast.yml'
      - 'daruri/qa/audit_arabic_native_414.py'
      - 'daruri/qa/diagnose_arabic_pdf_unicode.py'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: daruri-fast-native-414
  cancel-in-progress: true
jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check PyMuPDF==1.26.7
      - name: Audit 414 Arabic authorial passages in all fourteen source-containing editions
        run: |
          python daruri/qa/audit_arabic_native_414.py --output /tmp/daruri-414-matrix/414-matrix.json
      - name: Preserve diagnostic even if release fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daruri-source-arabic-414-diagnostic-NON-RELEASE
          path: /tmp/daruri-414-matrix/414-matrix.json
          if-no-files-found: warn
