name: Finalize Daruri contents integration
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/daruri-contents-finalize.yml'
      - 'daruri/qa/apply-contents-20261020.py'
permissions:
  contents: write
concurrency:
  group: daruri-contents-finalize
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Apply the reviewed change to current source
        run: python3 daruri/qa/apply-contents-20261020.py
      - name: Install the study-guide test dependency
        run: npm install --prefix "$RUNNER_TEMP/daruri-qa" --no-package-lock --no-audit --no-fund jsdom@26.1.0
      - name: Verify reader and study guide
        run: |
          node daruri/qa/verify-heading-contract.js
          node daruri/qa/verify-language-cycle.js
          node daruri/qa/verify-focus-modes.js
          NODE_PATH="$RUNNER_TEMP/daruri-qa/node_modules" node daruri/qa/verify-study-guide.js
          git diff --check
      - name: Publish without overwriting concurrent changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daruri/index.html daruri/sw.js
          git commit -m "Distinguish Daruri original headings and preserve reading returns"
          git push origin HEAD:master
