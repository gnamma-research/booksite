name: Daruri VOCALIZED/BILINGUAL native PDFKit verification (NON-RELEASE)
on:
  push:
    branches: [experiment/daruri-actualtext-source-20261022]
    paths:
      - 'daruri/qa/experimental_original_char_unicode.py'
      - 'daruri/qa/verify_char_unicode_pdfkit.swift'
      - '.github/workflows/daruri-char-unicode-pdfkit-profiles.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pdfkit:
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: vowelled-arabic-reading
            input: editions/reading/daruri-reading-arabic-vowelled-titles-off.pdf
            map: editions/maps/daruri-reading-arabic-vowelled-titles-off.pdf.json
          - id: bilingual-unvowelled-reading
            input: editions/reading/daruri-reading-bilingual-unvowelled-titles-off.pdf
            map: editions/maps/daruri-reading-bilingual-unvowelled-titles-off.pdf.json
          - id: scholarly-reference
            input: daruri.pdf
            map: personal-source-pango-maps/daruri.pdf.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check PyMuPDF==1.26.7
      - name: Create temporary semantic source PDF
        run: |
          python daruri/qa/experimental_original_char_unicode.py \
            --input daruri/${{ matrix.input }} \
            --map daruri/${{ matrix.map }} \
            --output /tmp/daruri-${{ matrix.id }}-PDFKit-candidate.pdf
      - name: Native macOS PDFKit all 414 passage search/geometry/copy checks
        run: |
          swift daruri/qa/verify_char_unicode_pdfkit.swift \
            /tmp/daruri-${{ matrix.id }}-PDFKit-candidate.pdf \
            daruri/${{ matrix.map }}
