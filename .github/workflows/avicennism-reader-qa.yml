name: Avicennism source-critical reader QA

on:
  push:
    branches:
      - feature/avicennism-nama-ready-reader-20261031
    paths:
      - 'research/avicennism/**'
      - '.github/workflows/avicennism-reader-qa.yml'
  pull_request:
    branches: [master]
    paths:
      - 'research/avicennism/**'
      - '.github/workflows/avicennism-reader-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avicennism-reader-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-interface:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate JavaScript and Python syntax
        run: |
          for js in research/avicennism/*.js; do node --check "$js"; done
          python -m py_compile research/avicennism/tests/*.py
      - name: Verify corpus, links, provenance and offline bundle
        run: python research/avicennism/tests/verify_reader.py
      - name: Install browser test harness
        run: |
          python -m pip install -q playwright==1.58.0
          python -m playwright install --with-deps chromium webkit
      - name: Test reader on desktop, portrait, landscape and offline file
        shell: bash
        run: |
          python -m http.server 8123 --bind 127.0.0.1 >/tmp/avicennism-server.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          for i in {1..80}; do
            if curl -fsS http://127.0.0.1:8123/research/avicennism/ >/dev/null; then break; fi
            sleep 0.2
          done
          python research/avicennism/tests/verify_browser.py --browser chromium
          python research/avicennism/tests/verify_browser.py --browser webkit
      - name: Build complete portable reader package
        run: python research/avicennism/build_portable.py
      - uses: actions/upload-artifact@v4
        with:
          name: NAMA-ready-Late-Avicennism-reader
          path: research/avicennism/NAMA_Late_Avicennism_Reader_2026-10-31.zip
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: avicennism-static-source-and-qa-logs
          path: |
            research/avicennism/tests/**
            /tmp/avicennism-server.log
          if-no-files-found: ignore
