name: Farghani introduction reader integrity and browser QA
on:
  push:
    branches: [master]
    paths:
      - 'texts/al-farghani/muntaha-al-madarik/**'
      - 'texts/manifest.json'
      - 'tests/farghani/**'
      - '.github/workflows/farghani-introduction-reader-qa.yml'
  pull_request:
    paths:
      - 'texts/al-farghani/muntaha-al-madarik/**'
      - 'tests/farghani/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: farghani-introduction-reader-master
  cancel-in-progress: true
jobs:
  static-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax-check both reader scripts and all bilingual modules
        run: |
          node --check texts/al-farghani/muntaha-al-madarik/full-reader.js
          node --check texts/al-farghani/muntaha-al-madarik/reader.js
          node --check texts/al-farghani/muntaha-al-madarik/critical-reader.js
          for file in texts/al-farghani/muntaha-al-madarik/data/*.js; do node --check "$file"; done
      - name: Verify 128 original-order source pages, 559 grade-aware loci, assets and anchor integrity
        run: python tests/farghani/verify_reader.py
  browser:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:v1.58.0-noble
    needs: static-integrity
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Use supported pinned browser runtime
        run: python -m pip install --quiet playwright==1.58.0
      - name: Exercise full introduction and bilingual views on desktop and phone
        run: |
          python -m http.server 8819 --bind 127.0.0.1 >/tmp/farghani-reader-http.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8819/texts/al-farghani/muntaha-al-madarik/continuous-translation.html >/dev/null; then break; fi
            sleep 0.3
          done
          python tests/farghani/verify_browser.py
      - name: Retain reader screenshots and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: farghani-introduction-reader-browser-qa
          path: |
            qa-artifacts/farghani/**
            /tmp/farghani-reader-http.log
          if-no-files-found: ignore
          retention-days: 14
