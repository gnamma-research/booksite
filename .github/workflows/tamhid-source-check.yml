name: Tamhid public source check
on:
  push:
    branches: [master]
    paths: ['.github/workflows/tamhid-source-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Retrieve a small source sample
        shell: python
        run: |
          import urllib.request, urllib.error, pathlib, json, time, re
          out=pathlib.Path('source-review'); out.mkdir()
          results=[]
          for p in [244,245,251,255,267,277,350,467]:
              url=f'https://ablibrary.net/book_content/b/17638/{p}?lang=ar'
              row={'index':p,'printed_page':p-196,'url':url}
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Gnamma scholarly source verification (public text; no authentication)'})
                  with urllib.request.urlopen(req,timeout=15) as response:
                      raw=response.read(1500000)
                      row.update(status=response.status,bytes=len(raw),content_type=response.headers.get('Content-Type',''))
                      text=raw.decode('utf-8',errors='replace')
                      row['arabic_characters']=len(re.findall(r'[\u0600-\u06ff]',text))
                      (out/f'page-{p}.html').write_text(text,encoding='utf-8')
              except Exception as error:
                  row['error']=str(error)
              results.append(row)
              print(json.dumps(row,ensure_ascii=False))
              time.sleep(1)
          (out/'source-status.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tamhid-public-source-sample
          path: source-review/
          retention-days: 1
