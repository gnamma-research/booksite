name: Daruri integration exact 120 dynamic PDF modular parity

on:
  push:
    branches: [integration/daruri-generated-worker-20261022]
    paths:
      - 'daruri/dynamic-pdf/core.js'
      - 'daruri/dynamic-pdf/assemble.worker.js'
      - '.github/workflows/daruri-generated-120-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-packets:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: audit
          ref: 1ca7d936de6a6f5bc669c57ba23ad964b8ac3637
      - uses: actions/checkout@v4
        with:
          path: booksite
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare pinned full scholarly Arabic publication stack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcairo2 libpango-1.0-0 libharfbuzz0b libfribidi0
          python -m pip install -q -r booksite/daruri/build/requirements.txt "PyMuPDF==1.26.7"
      - name: Build packet files and 120 SHA-bound approved-profile link maps
        run: python booksite/daruri/dynamic-pdf/build_packets.py
      - uses: actions/upload-artifact@v4
        with:
          name: integration-exact-link-fifteen-packets
          path: booksite/daruri/dynamic-pdf/packets/
          retention-days: 14

  smoke:
    needs: compile-packets
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: audit
          ref: 1ca7d936de6a6f5bc669c57ba23ad964b8ac3637
      - uses: actions/checkout@v4
        with:
          path: booksite
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: integration-exact-link-fifteen-packets
          path: booksite/daruri/dynamic-pdf/packets/
      - name: Install matched composer and comparison libraries
        run: |
          python -m pip install -q "PyMuPDF==1.26.7" "numpy>=1.26" "scipy>=1.13"
          npm install --no-save --no-package-lock --prefix booksite/daruri/qa pdf-lib@1.17.1
      - name: Compose three independent PDFs without touching published editions
        run: node booksite/daruri/dynamic-pdf/test_assemble.cjs
      - name: Certify all source pixels, bookmarks, sections and appendix links
        run: |
          python audit/daruri/qa/verify_dynamic_apparatus_links.py \
            --site booksite/daruri \
            --generated booksite/daruri/dynamic-pdf/test-output/smoke \
            --output /tmp/daruri-integration-exact-link/smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daruri-integration-exact-links-smoke
          path: /tmp/daruri-integration-exact-link/smoke/exact-link-parity.json
          if-no-files-found: warn

  all-120:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
        with:
          path: audit
          ref: 1ca7d936de6a6f5bc669c57ba23ad964b8ac3637
      - uses: actions/checkout@v4
        with:
          path: booksite
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: integration-exact-link-fifteen-packets
          path: booksite/daruri/dynamic-pdf/packets/
      - name: Install composer and multi-target minimum-distance verifier
        run: |
          python -m pip install -q "PyMuPDF==1.26.7" "numpy>=1.26" "scipy>=1.13"
          npm install --no-save --no-package-lock --prefix booksite/daruri/qa pdf-lib@1.17.1
      - name: Compose twenty PDFs from approved sources and SHA-pinned packets
        env:
          MATRIX: ALL
          SHARDS: '6'
          SHARD: ${{ matrix.shard }}
        run: node booksite/daruri/dynamic-pdf/test_assemble.cjs
      - name: Verify exact page images, text, 258 anchors, all link destination targets
        run: |
          python audit/daruri/qa/verify_dynamic_apparatus_links.py \
            --site booksite/daruri \
            --generated booksite/daruri/dynamic-pdf/test-output/shard${{ matrix.shard }} \
            --output /tmp/daruri-integration-exact-link/shard${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daruri-integration-exact-links-shard-${{ matrix.shard }}
          path: /tmp/daruri-integration-exact-link/shard${{ matrix.shard }}/exact-link-parity.json
          if-no-files-found: warn
