name: Diagnose Daruri native PDF word token order
on:
  workflow_dispatch:
  push:
    branches: [feature/daruri-two-tabs-inline-pdf-20261022]
    paths:
      - '.github/workflows/daruri-arabic-token-probe.yml'
      - 'daruri/qa/probe_arabic_pdf_words.py'
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install PyMuPDF==1.26.7
      - run: python daruri/qa/probe_arabic_pdf_words.py
