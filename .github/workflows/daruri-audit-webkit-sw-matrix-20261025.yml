name: Daruri WebKit service-worker cache workload matrix (nonrelease)
on:
  push:
    branches: [audit/daruri-cache-upgrade-20261025]
    paths:
      - 'daruri/qa/verify-webkit-sw-install-matrix.cjs'
      - '.github/workflows/daruri-audit-webkit-sw-matrix-20261025.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stage verified update in disposable test workspace
        run: python daruri/qa/stage-release-cache-version.py --apply
      - name: Remove unrelated apt repository
        run: |
          for source in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            [ -f "$source" ] || continue
            if grep -q 'packages.microsoft.com/ubuntu/24.04/prod' "$source"; then sudo mv "$source" "$source.disabled"; fi
          done
      - name: Install WebKit
        run: |
          npm install --no-save --prefix daruri/qa playwright@1.56.1
          npx --prefix daruri/qa playwright install --with-deps webkit
      - name: Diagnose CORE and OPTIONAL installation thresholds
        run: node daruri/qa/verify-webkit-sw-install-matrix.cjs
      - name: Archive complete synthetic WebKit SW evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daruri-webkit-core-optional-cache-matrix
          path: daruri/qa/cache-audit-artifacts/webkit-offline-install-matrix.json
          retention-days: 14
          if-no-files-found: warn
