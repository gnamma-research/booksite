name: Daruri Apparatus Selector and Personal PDF Browser QA
on:
  workflow_dispatch:
  push:
    branches: [feature/daruri-single-pdf-apparatus-20261021]
    paths:
      - ".github/workflows/daruri-apparatus-browser-qa.yml"
      - "daruri/editions-selector.js"
      - "daruri/editions-selector.css"
      - "daruri/personal-export.js"
      - "daruri/personal-export.html"
      - "daruri/qa/personal-export-browser.cjs"
      - "daruri/qa/verify-published-selector-browser.mjs"
      - "daruri/qa/verify-published-selector.cjs"
      - "daruri/qa/verify-personal-export-safety.js"
      - "daruri/qa/verify_apparatus_maps.py"
      - "daruri/editions/apparatus/**"
      - "daruri/download-bundle.js"
      - "daruri/sw.js"
permissions:
  contents: read
jobs:
  browser-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify JS code syntax and published assets
        run: |
          node --check daruri/editions-selector.js
          node --check daruri/personal-export.js
          node --check daruri/qa/verify-published-selector-browser.mjs
          node --check daruri/qa/personal-export-browser.cjs
          node daruri/qa/verify-ready-editions.js
          node daruri/qa/verify-published-selector.cjs
          node daruri/qa/verify-personal-export-safety.js
          node daruri/qa/verify-personal-export.js
      - name: Verify every PDF and named-source personal map
        run: |
          python -m pip install --disable-pip-version-check "PyMuPDF==1.26.7"
          python daruri/qa/verify_apparatus_maps.py
      - name: Install isolated PDF and browser QA packages
        run: |
          npm install --no-save --prefix daruri/qa playwright@1.56.1 pdf-lib@1.17.1
          npx --prefix daruri/qa playwright install --with-deps chromium
      - name: Test actual live-reader Editions selection on desktop and mobile
        shell: bash
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 > /tmp/daruri-apparatus-qa-server.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          for i in {1..60}; do
            if curl --silent --fail http://127.0.0.1:8123/daruri/ > /dev/null; then break; fi
            sleep 0.25
          done
          node daruri/qa/verify-published-selector-browser.mjs
      - name: Create a real personalized apparatus PDF with P-to-endnote links
        run: node daruri/qa/personal-export-browser.cjs
      - name: Preserve mobile/browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daruri-apparatus-browser-proof
          path: test-artifacts/*.png
          if-no-files-found: ignore
