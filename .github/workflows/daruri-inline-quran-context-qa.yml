name: Daruri inline Quran context QA
on:
  push:
    branches:
      - fix/inline-quran-note-card-20261022
    paths:
      - 'daruri/index.html'
      - 'daruri/source-note-ui.js'
      - 'daruri/quran-context-*'
      - 'daruri/QURAN_CONTEXT_SOURCES.md'
      - 'daruri/qa/verify-quran-context.js'
      - 'daruri/qa/verify-reader-source-notes.js'
      - 'daruri/sw.js'
      - 'daruri/download-bundle.js'
      - '.github/workflows/daruri-inline-quran-context-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quran-context:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Quran source, range, attribution and offline integrity
        run: node daruri/qa/verify-quran-context.js
      - name: Install DOM QA dependency
        run: npm install --no-save --no-package-lock jsdom@24
      - name: All 259 sections, inline Quran notes and context expansion
        run: node daruri/qa/verify-reader-source-notes.js
      - name: Source note and allusion integrity
        run: node daruri/qa/verify-section1-quran-parallels.js
