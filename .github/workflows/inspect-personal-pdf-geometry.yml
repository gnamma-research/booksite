name: Inspect PDF source text geometry
on:
  push:
    branches: [feature/personal-pdf-search-precise-highlights-20261021]
    paths: ['daruri/qa/inspect_pdf_anchor_text.py', '.github/workflows/inspect-personal-pdf-geometry.yml']
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install "PyMuPDF==1.26.5"
      - run: python daruri/qa/inspect_pdf_anchor_text.py