name: Daruri complete Scholarly browser WASM small-phone viewport + PSS memory QA (NONRELEASE)
on:
  push:
    branches: [research/daruri-browser-pdf-engine-shootout-20261025]
    paths:
      - '.github/workflows/daruri-full-scholarly-simulated-phone-memory-qa.yml'
      - 'daruri/qa/stage2_shootout/test_ultimate_typst_mobile_browser.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual_full_book_at_phone_screen_size:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            width: 390
            height: 844
          - browser: webkit
            width: 320
            height: 700
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Build current complete real Scholarly HTML and original note data
        run: |
          python -m pip install -q beautifulsoup4 PyMuPDF==1.26.7
          python daruri/qa/stage2_shootout/ultimate_html_fixture.py \
            daruri/qa/stage2_shootout/runtime_ultimate scholarly
          cp daruri/qa/stage2_shootout/runtime_ultimate/scholarly.html \
            daruri/qa/stage2_shootout/runtime_ultimate/scholarly.source.txt
      - name: Install pinned Typst WASM worker and real desktop browser with phone viewport
        run: |
          npm install --prefix daruri/qa/stage2_shootout --no-package-lock --no-audit --no-fund
          cd daruri/qa/stage2_shootout
          if [ '${{ matrix.browser }}' = chromium ]; then
            npx playwright install --with-deps --only-shell chromium
          else
            npx playwright install --with-deps webkit
          fi
      - name: Full 625-note complete Scholarly PDF Blob on a SIMULATED small-phone viewport
        env:
          BENCH_BROWSER: ${{ matrix.browser }}
          BENCH_WIDTH: ${{ matrix.width }}
          BENCH_HEIGHT: ${{ matrix.height }}
          BENCH_OUT: /tmp/gnamma-typst-phone-${{ matrix.browser }}
        run: |
          node --check daruri/qa/stage2_shootout/test_ultimate_typst_mobile_browser.cjs
          /usr/bin/time -v node daruri/qa/stage2_shootout/test_ultimate_typst_mobile_browser.cjs
      - name: PDF native structural and scholarly integrity check
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          pdf=/tmp/gnamma-typst-phone-${{ matrix.browser }}/daruri-scholarly-625-notes-browser-typst-NONRELEASE.pdf
          qpdf --check "$pdf"
          python daruri/qa/stage2_shootout/verify_scholarly_candidate.py \
             daruri/qa/stage2_shootout/runtime_ultimate/scholarly.html \
             "$pdf" /tmp/gnamma-typst-phone-${{ matrix.browser }}/scholarly-acceptance.json
          python daruri/qa/browser_engine_shootout_20261025/directory_folios.py \
             "$pdf" /tmp/gnamma-typst-phone-${{ matrix.browser }}/directory-folios.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daruri-full-scholarly-simulated-phone-${{ matrix.browser }}-PSS-memory-NONRELEASE
          path: /tmp/gnamma-typst-phone-${{ matrix.browser }}
          retention-days: 14
          if-no-files-found: warn
