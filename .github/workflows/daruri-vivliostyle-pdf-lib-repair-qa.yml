name: Daruri browser-compatible JS PDF-lib repair of Vivliostyle emitter (NONRELEASE)
on:
  push:
    branches: [research/daruri-browser-pdf-engine-shootout-20261025]
    paths:
      - '.github/workflows/daruri-vivliostyle-pdf-lib-repair-qa.yml'
      - 'daruri/qa/stage2_shootout/normalize_vivliostyle_pdf.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daruri-vivliostyle-pdflib-fix-${{ github.ref }}
  cancel-in-progress: true
jobs:
  client_pure_js_rewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Construct actual scholarly notes, bilingual text, and dictionary microbook
        run: |
          python -m pip install -q beautifulsoup4 PyMuPDF==1.26.7
          python daruri/qa/stage2_shootout/ultimate_html_fixture.py daruri/qa/stage2_shootout/runtime_ultimate scholarly
          python daruri/qa/stage2_shootout/vivliostyle_micro_fixture.py \
            daruri/qa/stage2_shootout/runtime_ultimate/scholarly.html \
            daruri/qa/stage2_shootout/runtime_ultimate/vivliostyle-micro.source.txt
      - name: Install browser-compatible JS PDF libraries and native qpdf checks
        run: |
          npm install --prefix daruri/qa/stage2_shootout --no-package-lock --no-audit --no-fund
          cd daruri/qa/stage2_shootout
          npx playwright install --with-deps --only-shell chromium
          cd ../../..
          mkdir -p fonts
          cp daruri/qa/stage2_shootout/node_modules/vivliostyle-pdf/public/fonts/*.ttf fonts/
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
      - name: Generate actual direct-Blob Vivliostyle PDF via browser
        env:
          BENCH_BROWSER: chromium
          BENCH_SOURCE: vivliostyle-micro
          BENCH_OUT: /tmp/gnamma-vivliostyle-pdf-lib-repair
        run: node daruri/qa/stage2_shootout/test_vivliostyle_pdf_browser.cjs
      - name: Reparse and resave original generated bytes with browser-compatible JS pdf-lib
        run: |
          node daruri/qa/stage2_shootout/normalize_vivliostyle_pdf.mjs \
            /tmp/gnamma-vivliostyle-pdf-lib-repair/daruri-vivliostyle-micro-vivliostyle-pdf-NONRELEASE.pdf \
            /tmp/gnamma-vivliostyle-pdf-lib-repair/rewritten
      - name: Independently check each object-stream strategy and Unicode copy
        run: |
          python - <<'PY'
          import subprocess,fitz,json,pathlib,collections
          p=pathlib.Path('/tmp/gnamma-vivliostyle-pdf-lib-repair')
          files=[p/'daruri-vivliostyle-micro-vivliostyle-pdf-NONRELEASE.pdf']+list((p/'rewritten').glob('*.pdf'))
          results={}
          fitz.TOOLS.mupdf_display_errors(False)
          for file in files:
              native=subprocess.run(['qpdf','--check',str(file)],capture_output=True,text=True)
              with fitz.open(file) as d:
                  text=''.join(x.get_text() for x in d)
                  kind=collections.Counter(l['kind'] for pg in d for l in pg.get_links())
                  import unicodedata
                  letters=sum('ARABIC' in unicodedata.name(c,'') and unicodedata.category(c).startswith('L') for c in text)
                  results[file.name]={'qpdf_exit':native.returncode,'qpdf_messages':native.stderr[:900],
                    'pages':len(d),'outlines':len(d.get_toc()),'links':dict(kind),
                    'arabic_letters_mupdf':letters,'readable_english_mupdf':'GNAMMA RESEARCH' in text}
          (p/'rewrite-comparison.json').write_text(json.dumps(results,ensure_ascii=False,indent=2))
          print('GNAMMA_BROWSER_JS_PDF_REWRITE_COMPARISON',json.dumps(results,ensure_ascii=False))
          assert len(results)>=2,'Browser-compatible JS PDF parser could not rewrite experimental output'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daruri-vivliostyle-micro-jspdf-lib-rewrite-comparison-NONRELEASE
          path: /tmp/gnamma-vivliostyle-pdf-lib-repair
          if-no-files-found: warn
          retention-days: 14
