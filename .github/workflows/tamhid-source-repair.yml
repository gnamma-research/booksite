name: Tamhid source boundary repair
on:
  push:
    branches: [master]
    paths: ['.github/workflows/tamhid-source-repair.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boundary-review:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - run: python -m pip install --quiet beautifulsoup4
      - name: Preserve ambiguous page structure for manual attribution
        shell: python
        run: |
          import pathlib,json,urllib.request,time
          from bs4 import BeautifulSoup
          out=pathlib.Path('boundary-review');out.mkdir()
          for p in [288,294,300,328,342,365]:
              url=f'https://ablibrary.net/book_content/b/17638/{p}?lang=ar'
              try:
                  request=urllib.request.Request(url,headers={'User-Agent':'Gnamma scholarly boundary verification'})
                  raw=urllib.request.urlopen(request,timeout=20).read(1500000)
                  soup=BeautifulSoup(raw,'html.parser')
                  article=soup.select_one('[itemprop="articleBody"]')
                  for nav in article.select('nav'):nav.decompose()
                  (out/f'page-{p}.html').write_text(str(article),encoding='utf-8')
                  (out/f'page-{p}.txt').write_text(article.get_text('\n',strip=True),encoding='utf-8')
                  print(p, len(raw))
              except Exception as e:print(p,str(e))
              time.sleep(1)
      - uses: actions/upload-artifact@v4
        with:
          name: tamhid-ambiguous-source-pages
          path: boundary-review/
          retention-days: 1
