name: Daruri Typst scholarly layout and bookmarks browser QA (NONRELEASE)
on:
  push:
    branches: [research/daruri-typst-scholarship-layout-20261024]
    paths:
      - 'daruri/qa/stage2_shootout/ultimate_*'
      - 'daruri/qa/stage2_shootout/test_ultimate_typst_browser.cjs'
      - 'daruri/qa/stage2_shootout/verify_scholarly_candidate.py'
      - '.github/workflows/daruri-stage2-ultimate-typst-browser.yml'
  workflow_dispatch:
  # Source-layout integration regression: latest canonical 258-section outline.
permissions:
  contents: read
concurrency:
  group: daruri-ultimate-typst-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-browser-ultimate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Source from Gnamma ORIGINAL FULL SCHOLARLY HTML only (never pdf inputs)
        run: |
          python -m pip install -q beautifulsoup4 PyMuPDF==1.26.7
          python daruri/qa/stage2_shootout/ultimate_html_fixture.py \
            daruri/qa/stage2_shootout/runtime_ultimate scholarly
          # Vite dev rewrites .html with its hot-reload client; serve a verbatim
          # text payload for precise on-device SHA-256 source checks.
          cp daruri/qa/stage2_shootout/runtime_ultimate/scholarly.html \
             daruri/qa/stage2_shootout/runtime_ultimate/scholarly.source.txt
      - name: Install pinned browser compiler and the selected native engine
        run: |
          npm install --prefix daruri/qa/stage2_shootout --no-package-lock --no-audit --no-fund
          cd daruri/qa/stage2_shootout
          if [ '${{ matrix.browser }}' = chromium ]; then
            npx playwright install --with-deps --only-shell chromium
          else
            npx playwright install --with-deps webkit
          fi
      - name: Measure cold-download-size upper bounds for static GitHub Pages WASM and font assets
        run: |
          cd daruri/qa/stage2_shootout
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import zlib from 'node:zlib';
          import {fileURLToPath} from 'node:url';
          const files=[
            'typst-wasm/engine/engine.core.wasm',
            'typst-wasm/engine/engine.core2.wasm',
            'typst-wasm/engine/engine.core3.wasm',
            '@typst-wasm/fonts/NewCMMath-Regular.otf'
          ];
          for(const filename of files){
            const resolved=fileURLToPath(new URL(import.meta.resolve(filename)));
            const b=fs.readFileSync(resolved);
            console.log('TYPST_ASSET_SIZE',JSON.stringify({
              filename,raw_bytes:b.length,gzip_bytes:zlib.gzipSync(b).length
            }));
          }
          NODE
      - name: Convert ACTUAL 2MB HTML to full Typst source and PDF inside browser only
        env:
          BENCH_BROWSER: ${{ matrix.browser }}
          BENCH_OUT: /tmp/daruri-ultimate-typst-${{ matrix.browser }}
        run: |
          node --check daruri/qa/stage2_shootout/ultimate_html_to_typst.mjs
          node --check daruri/qa/stage2_shootout/ultimate_typst_browser.mjs
          node --check daruri/qa/stage2_shootout/test_ultimate_typst_browser.cjs
          /usr/bin/time -v node daruri/qa/stage2_shootout/test_ultimate_typst_browser.cjs
      - name: Verify real PDF structure and original references without requiring exact Arabic vowelled Find
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          pdf=/tmp/daruri-ultimate-typst-${{ matrix.browser }}/daruri-scholarly-625-notes-browser-typst-NONRELEASE.pdf
          qpdf --check "$pdf"
          python daruri/qa/stage2_shootout/ultimate_pdf_qa.py "$pdf" \
            daruri/qa/stage2_shootout/runtime_ultimate/scholarly.source.json \
            /tmp/daruri-ultimate-typst-${{ matrix.browser }}/native-qa.json
      - name: Strict full 258-section topic bookmark and 625-note content QA
        run: |
          python daruri/qa/stage2_shootout/verify_scholarly_candidate.py \
            daruri/qa/stage2_shootout/runtime_ultimate/scholarly.html \
            /tmp/daruri-ultimate-typst-${{ matrix.browser }}/daruri-scholarly-625-notes-browser-typst-NONRELEASE.pdf \
            /tmp/daruri-ultimate-typst-${{ matrix.browser }}/scholarly-acceptance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daruri-full-scholarly-625-note-typst-${{ matrix.browser }}-NONRELEASE
          path: /tmp/daruri-ultimate-typst-${{ matrix.browser }}
          if-no-files-found: warn
          retention-days: 14