name: Daruri release cache and offline upgrade audit (nonrelease)
on:
  push:
    branches: [audit/daruri-cache-upgrade-20261025]
    paths:
      - 'daruri/qa/verify-release-cache-contract.cjs'
      - '.github/workflows/daruri-audit-cache-upgrade-20261025.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  cache-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and existing offline bundle contracts
        run: |
          node --check daruri/qa/verify-release-cache-contract.cjs
          node daruri/qa/verify-offline-downloads.cjs
      - name: Fail on unchanged cache identity after reader asset edits
        run: node daruri/qa/verify-release-cache-contract.cjs
      - name: Save exact ref/asset version mismatches
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daruri-release-cache-version-mismatch
          path: daruri/qa/cache-audit-artifacts/release-cache-contract.json
          retention-days: 14
          if-no-files-found: warn
