name: Qawtaw12 live scholarly-source verification
on:
  push:
    branches: [master]
    paths: ['.github/workflows/qawtaw12-live-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: texts/al-turka/qawaid-al-tawhid
          fetch-depth: 1
      - name: Compare three actual public files byte-for-byte
        run: |
          python - <<'PY'
          from pathlib import Path
          import concurrent.futures,hashlib,json,os,time,urllib.request
          root=Path('texts/al-turka/qawaid-al-tawhid')
          base='https://gnamma-research.github.io/booksite/'+str(root)+'/'
          files=['textual-decisions.html','editorial/QAWTAW12_WITNESS_ACCESS_2026-11-12.md','qa/qawtaw12-witness-acquisition.json']
          expected={f:hashlib.sha256((root/f).read_bytes()).hexdigest() for f in files}
          confirmed={}
          last=[]
          for attempt in range(1,22):
              remaining=[f for f in files if f not in confirmed]
              if not remaining:break
              last=[]
              def fetch(f):
                  req=urllib.request.Request(base+f+'?qawtaw12='+os.environ['GITHUB_SHA'],headers={'Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=30) as r:
                      return r.status,hashlib.sha256(r.read()).hexdigest()
              with concurrent.futures.ThreadPoolExecutor(max_workers=3) as ex:
                  futures={ex.submit(fetch,f):f for f in remaining}
                  for task in concurrent.futures.as_completed(futures):
                      f=futures[task]
                      try:
                          status,actual=task.result()
                          if status==200 and actual==expected[f]:confirmed[f]={'http':200,'sha256':actual}
                          else:last.append({'file':f,'http':status,'hashMatch':actual==expected[f]})
                      except Exception as e:last.append({'file':f,'error':str(e)})
              print(json.dumps({'attempt':attempt,'verified':len(confirmed),'pending':last}),flush=True)
              if len(confirmed)==len(files):break
              time.sleep(10)
          report={'success':len(confirmed)==len(files),'verifiedFiles':confirmed,'pending':last,'historicalPagesNewlyInspected':0,'ancestralWordsRecovered':0}
          Path('qawtaw12-public-verification.json').write_text(json.dumps(report,indent=2)+'\n')
          assert report['success'],'public deploy not yet byte-identical'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qawtaw12-public-verification
          path: qawtaw12-public-verification.json
          retention-days: 30
