name: Daruri Scholar Compact top toolbar QA
on:
  push:
    branches: [master]
    paths:
      - 'daruri/headerless-navigation.css'
      - 'daruri/headerless-navigation.js'
      - 'daruri/index.html'
      - 'daruri/qa/verify-scholar-compact-top.cjs'
      - '.github/workflows/daruri-scholar-compact-top.yml'
  pull_request:
    paths:
      - 'daruri/headerless-navigation.css'
      - 'daruri/headerless-navigation.js'
      - 'daruri/index.html'
      - 'daruri/qa/verify-scholar-compact-top.cjs'
      - '.github/workflows/daruri-scholar-compact-top.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  top-toolbar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static script check
        run: |
          node --check daruri/headerless-navigation.js
          node --check daruri/qa/verify-scholar-compact-top.cjs
      - name: Exclude unavailable unrelated Microsoft apt source
        run: |
          for source in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            [ -f "$source" ] || continue
            if grep -q 'packages.microsoft.com/ubuntu/24.04/prod' "$source"; then
              sudo mv "$source" "$source.disabled"
            fi
          done
      - name: Install browser test
        run: |
          npm install --no-save --prefix daruri/qa playwright@1.56.1
          npx --prefix daruri/qa playwright install --with-deps chromium webkit
      - name: Verify actual 320–390px and desktop reading toolbars
        run: node daruri/qa/verify-scholar-compact-top.cjs
