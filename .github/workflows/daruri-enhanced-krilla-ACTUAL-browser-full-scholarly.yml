name: Daruri complete Scholarly browser PDF with compiled enhanced Krilla WASM (NONRELEASE)
on:
  push:
    branches: [research/daruri-browser-pdf-engine-shootout-20261025]
    paths: ['.github/workflows/daruri-enhanced-krilla-ACTUAL-browser-full-scholarly.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  actual_browser_enhanced_typst_wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 42
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Build CURRENT canonical Scholarly full 625 notes and 157 dictionary articles
        run: |
          python -m pip install -q beautifulsoup4 PyMuPDF==1.26.7
          python daruri/qa/stage2_shootout/ultimate_html_fixture.py \
            daruri/qa/stage2_shootout/runtime_ultimate scholarly
          cp daruri/qa/stage2_shootout/runtime_ultimate/scholarly.html \
             daruri/qa/stage2_shootout/runtime_ultimate/scholarly.source.txt
      - name: Install original Typst-WASM browser frontend and Playwright engine
        run: |
          npm install --prefix daruri/qa/stage2_shootout --no-package-lock --no-audit --no-fund
          cd daruri/qa/stage2_shootout
          if [ '${{ matrix.browser }}' = chromium ]; then
            npx playwright install --with-deps --only-shell chromium
          else
            npx playwright install --with-deps webkit
          fi
      - name: Retrieve GitHub CI-built open-source enhanced Unicode WASI P2 engine by SHA
        uses: actions/download-artifact@v4
        with:
          name: daruri-enhanced-Krilla-typst-wasm-component-COMPILE-ONLY-NONRELEASE
          run-id: 40157893082
          github-token: ${{ github.token }}
          repository: gnamma-research/booksite
          path: /tmp/gnamma-patched-engine
      - name: Replace TEST-ONLY npm engine wasm component with pinned enhanced Krilla variant
        run: |
          set -euxo pipefail
          wasm=/tmp/gnamma-patched-engine/enhanced-typst-engine-NONRELEASE.wasm
          test -f "$wasm"
          echo '90e84337104d90d946c08ab4a77acccb150288b8f9eb5bd22416cf690f25642a  /tmp/gnamma-patched-engine/enhanced-typst-engine-NONRELEASE.wasm' | sha256sum --check
          file "$wasm"
          dst=daruri/qa/stage2_shootout/node_modules/typst-wasm/dist/engine/engine.core.wasm
          test -f "$dst"
          sha256sum "$dst"
          cp "$wasm" "$dst"
          sha256sum "$dst"
          echo 'Enhancing pinned typst-wasm 1.0 JS service with exact cloned MIT/Apache Typsastra WIT component'
      - name: Generate full original 625-note Scholarly PDF entirely inside real browser WebAssembly
        env:
          BENCH_BROWSER: ${{ matrix.browser }}
          BENCH_OUT: /tmp/gnamma-enhanced-browser-full-${{ matrix.browser }}
        run: |
          node --check daruri/qa/stage2_shootout/ultimate_html_to_typst.mjs
          node --check daruri/qa/stage2_shootout/ultimate_typst_browser.mjs
          /usr/bin/time -v node daruri/qa/stage2_shootout/test_ultimate_typst_browser.cjs
      - name: Independently validate full PDF, Arabic-to-Unicode and 258 TOC links
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          pdf=/tmp/gnamma-enhanced-browser-full-${{ matrix.browser }}/daruri-scholarly-625-notes-browser-typst-NONRELEASE.pdf
          qpdf --check "$pdf"
          python daruri/qa/stage2_shootout/verify_scholarly_candidate.py \
            daruri/qa/stage2_shootout/runtime_ultimate/scholarly.html \
            "$pdf" /tmp/gnamma-enhanced-browser-full-${{ matrix.browser }}/scholarly-acceptance.json
          python daruri/qa/browser_engine_shootout_20261025/enhanced_full_pdf_qa.py \
            daruri/qa/stage2_shootout/runtime_ultimate/scholarly.html \
            "$pdf" /tmp/gnamma-enhanced-browser-full-${{ matrix.browser }}/enhanced-browser-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daruri-enhanced-Krilla-browser-WASM-full-scholarship-${{ matrix.browser }}-NONRELEASE
          path: /tmp/gnamma-enhanced-browser-full-${{ matrix.browser }}
          if-no-files-found: warn
          retention-days: 14
