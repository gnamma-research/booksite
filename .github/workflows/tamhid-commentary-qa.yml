name: Tamhid commentary QA
on:
  push:
    branches: [master]
    paths:
      - 'texts/al-turka/qawaid-al-tawhid/**'
      - '.github/workflows/tamhid-commentary-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tamhid-commentary-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: texts/al-turka/qawaid-al-tawhid
      - name: Validate bilingual corpus and reader interactions
        run: node texts/al-turka/qawaid-al-tawhid/qa/check-commentary.mjs
      - name: Preserve checked reading files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tamhid-commentary-review
          path: texts/al-turka/qawaid-al-tawhid/
          retention-days: 7
